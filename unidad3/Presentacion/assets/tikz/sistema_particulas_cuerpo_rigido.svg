  <text x="325" y="145" font-family="Arial, sans-serif" font-size="16" fill="#dc2626">a_CM</text>
  <line x1="128" y1="225" x2="94" y2="188" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="65" y="184" font-family="Arial, sans-serif" font-size="16" fill="#16a34a">F_ext</text>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="15" fill="#334155">Se suman las fuerzas externas:</text>
  <text x="70" y="363" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">ΣF_ext = M·a_CM</text>

  <rect x="520" y="105" width="418" height="270" rx="18" fill="#f8fbff" stroke="#bfdbfe"/>
