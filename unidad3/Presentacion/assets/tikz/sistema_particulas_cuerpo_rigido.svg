  <text x="733" y="197" font-family="Arial, sans-serif" font-size="16" fill="#475569">r</text>
  <text x="548" y="340" font-family="Arial, sans-serif" font-size="15" fill="#334155">Traslación + rotación:</text>
  <text x="548" y="363" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">ΣF_ext = M·a_CM     y     Στ_ext = I·α</text>
