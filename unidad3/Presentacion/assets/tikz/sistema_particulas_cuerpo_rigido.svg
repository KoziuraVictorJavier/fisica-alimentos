  <rect width="980" height="430" rx="20" fill="#ffffff"/>
  <text x="36" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Sistema de partículas y cuerpo rígido</text>
  <text x="36" y="74" font-family="Arial, sans-serif" font-size="15" fill="#475569">El centro de masa permite representar el movimiento traslacional del conjunto; el cuerpo rígido agrega la rotación.</text>

  <rect x="42" y="105" width="420" height="270" rx="18" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="65" y="137" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Sistema de partículas</text>
  <circle cx="128" cy="225" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="214" cy="170" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <circle cx="292" cy="250" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
