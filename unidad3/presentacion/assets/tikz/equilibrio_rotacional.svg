<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Equilibrio rotacional con fuerzas F1 y F2</title>
  <desc id="desc">Barra rígida apoyada en un eje central. Una fuerza F1 actúa hacia abajo a la izquierda y otra fuerza F2 hacia abajo a la derecha. Se muestran las distancias r1 y r2 al eje y los torques opuestos que mantienen el equilibrio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4f8df7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9db4df" flood-opacity="0.35"/>
    </filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif; fill:#0f172a}
      .blue{fill:#1e3a8a}
      .muted{fill:#475569}
      .small{font-size:18px}
      .med{font-size:22px}
      .lg{font-size:26px; font-weight:700}
      .eq{font-size:28px; font-weight:700}
      .label{font-size:24px; font-weight:700}
      .italic{font-style:italic}
    </style>
  </defs>
  <rect x="10" y="10" width="980" height="500" rx="28" fill="url(#bg)" stroke="#bfd3ff" stroke-width="2"/>
  <text x="40" y="52" class="t lg blue">Equilibrio rotacional y equilibrio completo</text>
  <text x="40" y="82" class="t med muted">Las fuerzas aplicadas generan torques opuestos. Cuando la suma de torques es nula, la barra permanece en equilibrio.</text>

  <rect x="290" y="95" width="420" height="56" rx="16" fill="#ffffff" stroke="#cfe0ff" filter="url(#shadow)"/>
  <text x="500" y="131" text-anchor="middle" class="t eq blue">∑τ = 0   ⇒   F<tspan baseline-shift="sub" font-size="18">1</tspan> r<tspan baseline-shift="sub" font-size="18">1</tspan> = F<tspan baseline-shift="sub" font-size="18">2</tspan> r<tspan baseline-shift="sub" font-size="18">2</tspan></text>

  <!-- beam -->
  <g filter="url(#shadow)">
    <rect x="140" y="230" width="720" height="26" rx="13" fill="url(#beam)"/>
  </g>

  <!-- pivot -->
  <circle cx="500" cy="243" r="9" fill="#0f172a"/>
  <polygon points="470,288 530,288 500,244" fill="#f59e0b" opacity="0.9"/>
  <rect x="458" y="288" width="84" height="12" rx="6" fill="#94a3b8"/>
  <text x="500" y="330" text-anchor="middle" class="t med blue">eje de giro</text>

  <!-- left and right force application points -->
  <circle cx="280" cy="243" r="7" fill="#e11d48"/>
  <circle cx="720" cy="243" r="7" fill="#16a34a"/>

  <!-- forces -->
  <line x1="280" y1="130" x2="280" y2="232" stroke="#e11d48" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="294" y="168" class="t label" fill="#e11d48">F<tspan baseline-shift="sub" font-size="16">1</tspan></text>

  <line x1="720" y1="110" x2="720" y2="232" stroke="#16a34a" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="734" y="156" class="t label" fill="#16a34a">F<tspan baseline-shift="sub" font-size="16">2</tspan></text>

  <!-- distances -->
  <line x1="500" y1="195" x2="280" y2="195" stroke="#64748b" stroke-width="2.5" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <line x1="500" y1="175" x2="720" y2="175" stroke="#64748b" stroke-width="2.5" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <text x="390" y="186" text-anchor="middle" class="t med">r<tspan baseline-shift="sub" font-size="14">1</tspan></text>
  <text x="610" y="166" text-anchor="middle" class="t med">r<tspan baseline-shift="sub" font-size="14">2</tspan></text>

  <!-- support dashed lines -->
  <line x1="280" y1="170" x2="280" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="720" y1="150" x2="720" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="500" y1="150" x2="500" y2="302" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- torque arrows -->
  <path d="M360,305 A110,110 0 0 1 450,160" fill="none" stroke="#e11d48" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="340" y="286" class="t med" fill="#e11d48">τ<tspan baseline-shift="sub" font-size="14">1</tspan> antihorario</text>
  <path d="M640,160 A110,110 0 0 1 735,305" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="636" y="286" class="t med" fill="#16a34a">τ<tspan baseline-shift="sub" font-size="14">2</tspan> horario</text>

  <!-- equilibrium conditions -->
  <rect x="90" y="368" width="820" height="104" rx="18" fill="#ffffff" stroke="#d6e4ff"/>
  <text x="120" y="404" class="t med blue" style="font-weight:700">Condiciones de equilibrio completo</text>
  <text x="120" y="435" class="t med">• Equilibrio traslacional: ∑F<tspan baseline-shift="sub" font-size="14">x</tspan> = 0,   ∑F<tspan baseline-shift="sub" font-size="14">y</tspan> = 0</text>
  <text x="120" y="462" class="t med">• Equilibrio rotacional: ∑τ = 0</text>
  <text x="620" y="435" class="t small muted">Si uno de los torques aumenta, el sistema deja de estar balanceado.</text>
  <text x="620" y="462" class="t small muted">En problemas de palancas, tapas o soportes, el brazo de palanca es decisivo.</text>
</svg>