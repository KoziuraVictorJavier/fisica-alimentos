<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#fff;color:#17364b}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px}.panel{border:1px solid #d5e6ee;border-radius:12px;padding:10px;background:#fbfeff}.panel h4{margin:0 0 8px;color:#14536b;font-size:16px;text-align:center}.cap{font-size:12px;color:#5b7788;text-align:center;margin-top:6px}svg{width:100%;height:auto;display:block}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><h4>Líneas de campo y equipotenciales de una carga puntual</h4><svg viewBox="0 0 320 240" aria-label="Líneas de campo y superficies equipotenciales de una carga positiva"><defs><marker id="arr1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#156c93"/></marker></defs><circle cx="160" cy="118" r="18" fill="#f2554b"/><text x="160" y="124" font-size="22" text-anchor="middle" fill="#fff">+</text><circle cx="160" cy="118" r="44" fill="none" stroke="#3f97db" stroke-width="2" stroke-dasharray="6 6"/><circle cx="160" cy="118" r="74" fill="none" stroke="#3f97db" stroke-width="2" stroke-dasharray="6 6"/><circle cx="160" cy="118" r="102" fill="none" stroke="#3f97db" stroke-width="2" stroke-dasharray="6 6"/><g stroke="#156c93" stroke-width="2.2" marker-end="url(#arr1)"><line x1="183" y1="118" x2="266" y2="118"/><line x1="176" y1="134" x2="235" y2="193"/><line x1="160" y1="141" x2="160" y2="224"/><line x1="144" y1="134" x2="85" y2="193"/><line x1="137" y1="118" x2="54" y2="118"/><line x1="144" y1="102" x2="85" y2="43"/><line x1="160" y1="95" x2="160" y2="12"/><line x1="176" y1="102" x2="235" y2="43"/></g><text x="160" y="18" font-size="12" text-anchor="middle" fill="#4b6c7c">Líneas discontinuas: equipotenciales</text><text x="240" y="112" font-size="12" fill="#4b6c7c">Campo</text></svg><div class="cap">Las líneas de campo son perpendiculares a las equipotenciales y salen de la carga positiva.</div></div><div class="panel"><h4>Campo uniforme entre placas paralelas</h4><svg viewBox="0 0 320 240" aria-label="Campo uniforme y equipotenciales entre placas"><defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#156c93"/></marker></defs><rect x="40" y="30" width="28" height="160" rx="6" fill="#f57b52" stroke="#d0542f"/><rect x="252" y="30" width="28" height="160" rx="6" fill="#4aa3ea" stroke="#2a77b2"/><text x="54" y="22" text-anchor="middle" font-size="24" fill="#d0542f">+</text><text x="266" y="22" text-anchor="middle" font-size="24" fill="#2a77b2">−</text><g stroke="#156c93" stroke-width="2.2" marker-end="url(#arr2)"><line x1="76" y1="52" x2="240" y2="52"/><line x1="76" y1="82" x2="240" y2="82"/><line x1="76" y1="112" x2="240" y2="112"/><line x1="76" y1="142" x2="240" y2="142"/><line x1="76" y1="172" x2="240" y2="172"/></g><g stroke="#3f97db" stroke-width="2" stroke-dasharray="6 5"><line x1="112" y1="34" x2="112" y2="190"/><line x1="148" y1="34" x2="148" y2="190"/><line x1="184" y1="34" x2="184" y2="190"/><line x1="220" y1="34" x2="220" y2="190"/></g><text x="160" y="224" text-anchor="middle" font-size="12" fill="#4b6c7c">Las equipotenciales son planos paralelos a las placas.</text></svg><div class="cap">Al desplazarnos en el sentido del campo, el potencial disminuye.</div></div></div></body></html>
