<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#fff;color:#17364b}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px}.panel{border:1px solid #d5e6ee;border-radius:12px;padding:10px;background:#fbfeff}.panel h4{margin:0 0 8px;color:#14536b;font-size:16px;text-align:center}.cap{font-size:12px;color:#5b7788;text-align:center;margin-top:6px}svg{width:100%;height:auto;display:block}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><h4>Campo eléctrico E(r)</h4><svg viewBox="0 0 340 250" aria-label="Gráfico de campo eléctrico para distintas distribuciones esféricas"><rect x="48" y="20" width="250" height="180" fill="#fff" stroke="#dce9ef"/><line x1="48" y1="200" x2="308" y2="200" stroke="#37596b" stroke-width="2"/><line x1="48" y1="200" x2="48" y2="20" stroke="#37596b" stroke-width="2"/><text x="316" y="204" font-size="12" fill="#37596b">r</text><text x="38" y="20" font-size="12" fill="#37596b">E</text><line x1="170" y1="200" x2="170" y2="20" stroke="#aabec8" stroke-dasharray="5 5"/><text x="166" y="216" font-size="12" fill="#4b6c7c">R</text><path d="M48 200 L170 70 L230 120 L308 156" fill="none" stroke="#0e8b8d" stroke-width="4"/><path d="M48 200 L170 200 L230 120 L308 156" fill="none" stroke="#f28c1b" stroke-width="4"/><text x="176" y="54" font-size="12" fill="#0e8b8d">Esfera maciza aislante uniforme</text><text x="172" y="190" font-size="12" fill="#f28c1b">Cáscara o esfera conductora</text></svg><div class="cap">En la esfera maciza aislante uniforme, E crece linealmente dentro. En una cáscara o conductor es nulo en el interior y fuera decrece como 1/r².</div></div><div class="panel"><h4>Potencial eléctrico V(r)</h4><svg viewBox="0 0 340 250" aria-label="Gráfico de potencial eléctrico para distintas distribuciones esféricas"><rect x="48" y="20" width="250" height="180" fill="#fff" stroke="#dce9ef"/><line x1="48" y1="200" x2="308" y2="200" stroke="#37596b" stroke-width="2"/><line x1="48" y1="200" x2="48" y2="20" stroke="#37596b" stroke-width="2"/><text x="316" y="204" font-size="12" fill="#37596b">r</text><text x="38" y="20" font-size="12" fill="#37596b">V</text><line x1="170" y1="200" x2="170" y2="20" stroke="#aabec8" stroke-dasharray="5 5"/><text x="166" y="216" font-size="12" fill="#4b6c7c">R</text><path d="M48 66 Q110 66 170 66 L230 120 L308 156" fill="none" stroke="#f28c1b" stroke-width="4"/><path d="M48 84 Q100 82 170 66 L230 120 L308 156" fill="none" stroke="#0e8b8d" stroke-width="4"/><text x="178" y="54" font-size="12" fill="#f28c1b">Conductor o cáscara: V constante dentro</text><text x="112" y="104" font-size="12" fill="#0e8b8d">Esfera maciza aislante: V varía dentro</text></svg><div class="cap">El potencial es continuo. Puede ser constante y no nulo, aun cuando el campo interior valga cero.</div></div></div></body></html>
