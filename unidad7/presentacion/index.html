<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidad 7 · Presentación interactiva</title><style>
:root{--ink:#17364b;--blue:#105873;--teal:#0d8b8d;--line:#d7e5ea;--paper:#fff;--bg:#eff5f8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}.app{min-height:100vh;display:flex;flex-direction:column}.bar{position:sticky;top:0;z-index:20;background:#123b52;color:white;display:flex;align-items:center;gap:10px;padding:9px 17px;flex-wrap:wrap;box-shadow:0 4px 14px #142b3a25}.brand{font-weight:800;letter-spacing:.02em;margin-right:auto}.bar button,.bar select,.bottom button,.script-buttons button{font:inherit;padding:8px 12px;border:1px solid #b6d1da;border-radius:8px;background:white;color:#174d65;cursor:pointer}.bar button:disabled,.bottom button:disabled{opacity:.4;cursor:not-allowed}.bar select{max-width:280px}.body{flex:1;width:min(1160px,100%);margin:auto;padding:18px 20px 30px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:calc(100vh - 185px);box-shadow:0 10px 35px #17364b13;padding:clamp(20px,4vw,50px)}.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.14em;color:#0c878b}.sheet h1{font-size:clamp(1.65rem,3.8vw,2.8rem);line-height:1.18;margin:10px 0 22px;color:#12435d}.content{font-size:clamp(1rem,1.8vw,1.19rem);line-height:1.7}.content ul{padding-left:24px}.content li{margin:10px 0}.lead{font-size:1.2em;color:#26556b}.formula{max-width:100%;overflow:auto;background:#eef8fb;border:1px solid #cfe6ed;border-radius:12px;padding:12px 16px;text-align:center;font-size:clamp(1.25rem,2.5vw,1.7rem);margin:14px auto;font-family:Cambria,'Times New Roman',serif}.muted,.note{color:#617d8a;font-size:.92rem}.note{padding:10px 14px;border-left:3px solid #0a8c8d;background:#f2f9fa}.infobox{display:flex;align-items:center;gap:24px;min-height:220px;padding:27px;background:repeating-linear-gradient(135deg,#edf5fa,#edf5fa 16px,#e5f0f6 16px,#e5f0f6 32px);border:2px dashed #8db6cb;border-radius:16px}.infoicon{font-size:4rem;color:#437e98}.infoname{font-size:1.25rem;font-weight:750;color:#145c75}.infobox p{font-size:.88rem;color:#55778b}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.timeline span{padding:7px 10px;border:1px solid #c9e0e9;border-radius:8px;background:#f6fafb;font-size:.8rem}.diagram{border:1px solid #d4e6ec;border-radius:12px;width:100%;background:white}.labframe{display:block;width:100%;height:min(74vh,760px);min-height:530px;border:1px solid #c9dfe8;background:#fff;border-radius:13px}.posterimg{display:block;width:100%;height:auto;border:1px solid #d1e3ea;border-radius:14px;background:#fff;box-shadow:0 8px 24px #17364b12}.imgnote{margin-top:10px;color:#5f7b8b;font-size:.9rem}.imgstack{display:grid;gap:14px}.labdesc{padding:9px 0 17px;color:#376277}.tablewrap{width:100%;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.91rem}td,th{border-bottom:1px solid #dce6ed;padding:11px;text-align:left}th{background:#edf7f8}.bottom{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}.counter{color:#5f7b8b;font-variant-numeric:tabular-nums}.scriptarea{width:100%;min-height:190px;font:15px/1.55 system-ui;border:1px solid #a7c6d4;border-radius:9px;padding:12px;resize:vertical}.scriptbox{display:none;margin-top:18px;padding:18px;border:1px solid #b8d6e2;border-radius:14px;background:#f3fafc}.scriptbox.visible{display:block}.script-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.speechstatus{font-size:.76rem;color:#cee7ef;width:100%}.bar label{font-size:.82rem}.bar input[type=range]{width:78px;accent-color:#71d3d4}.sheet.cover{background:linear-gradient(145deg,#edf8fa,#fff 68%)}.sheet.lab{padding:clamp(16px,2.5vw,28px)}.sheet.lab h1{margin-bottom:10px;font-size:clamp(1.5rem,3vw,2.2rem)}@media(max-width:680px){.bar{position:relative;padding:9px}.brand{width:100%}.bar select{max-width:100%;width:100%}.body{padding:10px}.sheet{min-height:0;padding:18px}.content{font-size:1rem}.infobox{min-height:190px;gap:12px;padding:16px}.infoicon{font-size:2.5rem}.labframe{height:700px;min-height:600px}.bottom{margin-bottom:12px}}@media print{.bar,.bottom,.scriptbox{display:none!important}.sheet{box-shadow:none;min-height:auto}.body{padding:0}}
</style></head><body><div class="app"><header class="bar"><span class="brand">UTN · FÍSICA APLICADA · UNIDAD 7</span><select id="goto" aria-label="Ir a filmina"></select><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="speak">▶ Leer</button><button id="pause">⏸</button><button id="resume">⏵</button><button id="stop">■</button><button id="toggleScript">Editar guion</button><label>Voz <input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"></label><div class="speechstatus" id="speechstatus">La voz utiliza el sintetizador del navegador. Las expresiones matemáticas se leen mediante el guion.</div></header><div class="body"><article class="sheet" id="sheet"><div class="eyebrow" id="kicker"></div><h1 id="heading"></h1><div class="content" id="content"></div><div class="scriptbox" id="scriptbox"><label for="scriptarea"><b>Guion de la filmina — editable</b></label><textarea id="scriptarea" class="scriptarea"></textarea><div class="script-buttons"><button id="saveScript">Guardar</button><button id="resetScript">Restablecer</button><button id="exportScripts">Exportar JSON</button><button id="importScripts">Importar JSON</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div></article><nav class="bottom"><button id="prev2">← Anterior</button><span class="counter" id="counter"></span><button id="next2">Siguiente →</button></nav></div></div><script>
const slides=[{"title": "Electricidad aplicada", "kicker": "UNIDAD 7 · TECNICATURA EN ALIMENTOS", "body": "<p class=\"lead\">De la carga eléctrica a los campos, los circuitos y la instrumentación de los procesos alimentarios.<\/p><ul><li>Conceptos explicados desde fenómenos observables<\/li><li>Simbología eléctrica, ecuaciones y aplicaciones industriales<\/li><li>Simuladores interactivos y actividades de interpretación<\/li><\/ul>", "script": "Presentamos la unidad siete, Electricidad aplicada. Partiremos de la electrización y la noción de campo. Luego relacionaremos fuerza, campo y potencial, estudiaremos materiales y circuitos, y terminaremos con electromagnetismo e instrumentación. Cada simulación permite modificar parámetros y observar las consecuencias físicas.", "kind": "cover", "sim": null}, {"title": "Objetivos y recorrido", "kicker": "ORIENTACIÓN", "body": "<ul><li>Distinguir carga, fuerza, campo y potencial eléctrico.<\/li><li>Interpretar conductores, aislantes y distribución de carga en geometrías esféricas.<\/li><li>Explicar la electrización, la inducción y el funcionamiento del electroscopio.<\/li><li>Aplicar la ley de Ohm y las leyes de Kirchhoff.<\/li><li>Reconocer los principios de sensores y actuadores eléctricos.<\/li><\/ul>", "script": "Esta presentación sigue la misma secuencia conceptual del apunte de la unidad. El objetivo no es memorizar fórmulas aisladas: buscamos reconocer el sistema físico, las hipótesis del modelo y la relación entre las magnitudes que intervienen.", "kind": "concept", "sim": null}, {"title": "Historia de la electricidad y el magnetismo", "kicker": "MARCO HISTÓRICO", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/historia_electricidad_magnetismo.png\" alt=\"Infografía: historia de la electricidad y el magnetismo\"><p class=\"imgnote\">La línea de tiempo resume hitos desde las observaciones antiguas del ámbar y la magnetita hasta la síntesis del electromagnetismo y su verificación experimental.<\/p><\/div>", "script": "Desde las observaciones antiguas del ámbar electrizado y la magnetita, la electricidad y el magnetismo se estudiaron inicialmente como fenómenos separados. Gilbert distinguió algunas propiedades de ambos. Coulomb cuantificó fuerzas entre cargas; Volta desarrolló una fuente de corriente continua; Ørsted y Ampère conectaron electricidad con magnetismo. Faraday observó la inducción, Maxwell organizó la teoría de campos y Hertz confirmó experimentalmente las ondas electromagnéticas.", "kind": "infographic", "sim": null}, {"title": "Un concepto que reúne muchos fenómenos: campo", "kicker": "CAMPO FÍSICO", "body": "<p class=\"lead\">Un campo asigna un valor físico a cada punto de una región del espacio.<\/p><ul><li><b>Escalar:<\/b> temperatura, presión, potencial eléctrico.<\/li><li><b>Vectorial:<\/b> campo gravitatorio, eléctrico o magnético.<\/li><li>Las flechas representan dirección, sentido e intensidad; las líneas de campo son una representación geométrica.<\/li><\/ul>", "script": "Un campo físico describe cómo varía una magnitud de un punto a otro. Un campo escalar asigna un número, como la temperatura. Un campo vectorial asigna un vector, como el campo gravitatorio o eléctrico. Es importante diferenciar la región donde existe el campo del objeto que experimenta una fuerza.", "kind": "concept", "sim": null}, {"title": "Infografía: campo escalar y vectorial", "kicker": "CAMPO · APOYO VISUAL", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/concepto_campo.png\" alt=\"Infografía: concepto de campo\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/campo_concepto.html\" style=\"height:300px\"><\/iframe><p class=\"imgnote\">La infografía integra campo escalar, campo vectorial, modos de representación y la idea de superposición.<\/p><\/div>", "script": "La infografía incorporada compara campos escalares y vectoriales, muestra distintas representaciones y recupera la idea de superposición. Conviene remarcar que las líneas y flechas son herramientas de representación, no objetos materiales que llenan el espacio.", "kind": "infographic", "sim": null}, {"title": "Campo gravitatorio como referencia", "kicker": "CAMPO FÍSICO", "body": "<div class=\"formula\">𝐅<sub>g<\/sub> = m 𝐠<\/div><div class=\"formula\">𝐠 ≈ (0; −9,81; 0) N/kg<\/div><p>Se adopta eje vertical positivo hacia arriba y una región pequeña próxima a la superficie terrestre.<\/p>", "script": "Retomamos un ejemplo conocido. La Tierra produce un campo gravitatorio. Una masa colocada en él experimenta una fuerza igual a la masa por el campo. Cerca de la superficie terrestre, en una región pequeña, el campo puede considerarse aproximadamente uniforme. Su valor es menos nueve coma ochenta y uno en la dirección vertical, tomando positivo hacia arriba.", "kind": "concept", "sim": null}, {"title": "Carga eléctrica: qué es y cómo se conserva", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">q = n e<\/div><ul><li>Existen cargas positivas y negativas.<\/li><li>La electrización modifica el balance de cargas; no crea carga neta.<\/li><li>En sólidos, la transferencia suele involucrar electrones.<\/li><\/ul>", "script": "La carga eléctrica es una propiedad de la materia responsable de las interacciones electromagnéticas. Los protones tienen carga positiva y los electrones, negativa. La carga total de un sistema aislado se conserva. En la electrización habitual de cuerpos sólidos se transfieren electrones: el cuerpo que los pierde queda con carga neta positiva.", "kind": "concept", "sim": null}, {"title": "Formas de electrización", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/carga_electrica_electrizacion.png\" alt=\"Infografía: carga eléctrica y formas de electrización\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/cargas_transferencia.html\" style=\"height:250px\"><\/iframe><ul><li><b>Frotamiento:<\/b> transferencia de electrones entre materiales.<\/li><li><b>Contacto:<\/b> redistribución de carga al tocar un conductor cargado con otro cuerpo.<\/li><li><b>Inducción:<\/b> redistribución sin contacto; para una carga neta permanente puede intervenir una puesta a tierra.<\/li><\/ul><\/div>", "script": "Se distinguen tres procesos. El frotamiento puede transferir electrones entre cuerpos. Por contacto, la carga se redistribuye al permitir el intercambio. En la inducción, un cuerpo cargado cercano provoca una redistribución sin tocar. Para dejar un cuerpo con carga neta por inducción es necesaria una secuencia apropiada que permita transferencia, como conexión a tierra.", "kind": "infographic", "sim": null}, {"title": "Material conductor y material aislante", "kicker": "MATERIALES", "body": "<ul><li><b>Conductor:<\/b> dispone de portadores de carga con gran movilidad; en metales son electrones.<\/li><li><b>Aislante:<\/b> dificulta el transporte macroscópico de carga, pero puede polarizarse.<\/li><li>El comportamiento depende del material, las condiciones y la geometría.<\/li><\/ul><p class=\"note\">Ejemplos: cobre y aluminio como conductores; vidrio seco, muchos plásticos y cerámicas como aislantes.<\/p>", "script": "Un material conductor contiene portadores de carga que se desplazan relativamente fácilmente. En cambio, en un aislante la movilidad de esos portadores es muy reducida. Esto no significa que un aislante sea indiferente al campo eléctrico: también puede polarizarse. La diferencia será fundamental para estudiar dónde queda localizada la carga.", "kind": "concept", "sim": null}, {"title": "Comparación de materiales y cargas", "kicker": "MATERIALES · INFOGRAFÍA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/conductores_aislantes_electroscopio.png\" alt=\"Infografía: conductores, aislantes y electroscopio\"><p class=\"imgnote\">La lámina vincula movilidad de cargas, polarización y funcionamiento del electroscopio de hojas como detector cualitativo de carga.<\/p><\/div>", "script": "La infografía muestra que en un conductor existen portadores móviles que permiten la redistribución de carga, mientras que en un aislante predominan la localización de carga y la polarización. También incorpora el electroscopio como aplicación cualitativa.", "kind": "infographic", "sim": null}, {"title": "Distribución de cargas en esferas", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/distribucion_cargas_esferas.png\" alt=\"Infografía: distribución de cargas en esferas\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/esferas.html\" style=\"height:360px\"><\/iframe><p class=\"imgnote\">La comparación distingue los casos conductor y no conductor, macizo y hueco, incluyendo campo interior, potencial y efecto de punta.<\/p><\/div>", "script": "La distribución de cargas depende del material y la geometría. En un conductor aislado en equilibrio electrostático y sin cargas en cavidades, la carga neta excedente se sitúa en la superficie exterior. En aislantes no podemos afirmar uniformidad de manera general: debemos especificar cómo se electrizó el material y qué hipótesis utilizamos.", "kind": "infographic", "sim": null}, {"title": "Fuerza eléctrica: ley de Coulomb", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">F = k |q₁q₂| / r²<\/div><ul><li>Para cargas puntuales estacionarias, la fuerza actúa sobre la recta que las une.<\/li><li>Mismo signo: repulsión; signos opuestos: atracción.<\/li><li>La distancia interviene al cuadrado.<\/li><\/ul>", "script": "La ley de Coulomb determina el módulo de la fuerza eléctrica entre dos cargas puntuales. La fuerza crece con los módulos de las cargas y disminuye con el cuadrado de la separación. La dirección coincide con la recta que une las cargas; el sentido depende de sus signos.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Coulomb", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Fuerza eléctrica entre dos cargas<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Fuerza eléctrica entre dos cargas\" data-sim=\"s4\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Utilicen el laboratorio para cambiar las cargas y la distancia. Observen cómo cambia la fuerza. Comparen qué sucede al duplicar la distancia, invertir el signo de una carga y modificar uno de sus módulos. El propósito es comprobar tendencias de la ley de Coulomb.", "kind": "lab", "sim": "s4"}, {"title": "Electroscopio de hojas", "kicker": "ELECTROSTÁTICA", "body": "<ul><li>Detecta electrización por separación de dos hojas conductoras.<\/li><li>La repulsión eléctrica tiende a abrirlas; las acciones mecánicas se oponen.<\/li><li>Puede cargarse por contacto y experimentar polarización por inducción.<\/li><\/ul>", "script": "Un electroscopio de hojas posee un terminal metálico unido a una varilla y dos hojas delgadas. Cuando ambas hojas adquieren cargas del mismo signo, se repelen y se separan. El ángulo de equilibrio resulta de la interacción entre fuerzas electrostáticas y mecánicas. No representa una medida universal de carga: depende de la geometría y las propiedades del instrumento.", "kind": "concept", "sim": null}, {"title": "Laboratorio: cargar y descargar un electroscopio", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Electroscopio de hojas: carga, descarga e inducción<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Electroscopio de hojas: carga, descarga e inducción\" data-sim=\"selectro\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Carguen el electroscopio y observen la apertura. Cambien el signo y comparen. Luego acerquen un cuerpo cargado, sin tocar, y observen los efectos de inducción. Finalmente descarguen el instrumento. La gráfica utiliza un modelo didáctico, no una calibración experimental exacta.", "kind": "lab", "sim": "selectro"}, {"title": "Campo eléctrico y líneas de campo", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">𝐄 = 𝐅 / q<sub>prueba<\/sub><\/div><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/campo_pos_neg.html\" style=\"height:345px\"><\/iframe>", "script": "El campo eléctrico describe la fuerza por unidad de carga de prueba positiva. Sus líneas son curvas tangentes al vector campo. Salen de cargas positivas y entran en negativas. No se cruzan y su concentración representa cualitativamente la intensidad. No son necesariamente las trayectorias de partículas cargadas.", "kind": "concept", "sim": null}, {"title": "Superposición de campos", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">𝐄<sub>R<\/sub> = 𝐄₁ + 𝐄₂ + …<\/div><ul><li>La suma es vectorial, no solamente de módulos.<\/li><li>En puntos de simetría pueden cancelarse contribuciones.<\/li><li>Campo nulo no implica ausencia de cargas fuentes.<\/li><\/ul>", "script": "Cuando hay varias cargas, cada una genera un campo eléctrico. El campo total es la suma vectorial de todos esos aportes. En algunos puntos, campos individuales no nulos pueden cancelarse. Para resolverlo necesitamos analizar direcciones y sentidos, no simplemente sumar intensidades.", "kind": "concept", "sim": null}, {"title": "Ley de Gauss: idea física", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">∮<sub>S<\/sub> 𝐄 · d𝐀 = Q<sub>enc<\/sub> / ε₀<\/div><ul><li>El flujo relaciona campo eléctrico y superficie cerrada.<\/li><li>Con suficiente simetría permite calcular el campo.<\/li><li>La carga encerrada determina el flujo neto.<\/li><\/ul>", "script": "La ley de Gauss relaciona el flujo del campo eléctrico a través de una superficie cerrada con la carga neta encerrada. La utilidad para calcular el campo depende de la simetría. En la esfera uniformemente cargada podemos elegir superficies esféricas concéntricas donde el campo radial tiene igual módulo.", "kind": "concept", "sim": null}, {"title": "Laboratorio 3D: esfera uniformemente cargada", "kicker": "SIMULACIÓN 3D · GAUSS", "body": "<div class=\"labdesc\">Simulador original de la esfera maciza aislante con carga volumétrica uniforme, campo y potencial.<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulador tridimensional de Gauss\" data-static=\"assets/gauss.html\" src=\"about:blank\"><\/iframe><p class=\"muted\">Three.js y MathJax requieren conexión a Internet en esta versión del simulador.<\/p>", "script": "Roten la esfera y observen cómo cambia la superficie gaussiana al modificar su radio. Comparen los casos interior, frontera y exterior. La distribución uniforme de carga en el volumen es la hipótesis del modelo: no describe una esfera conductora en equilibrio.", "kind": "lab", "sim": "gauss"}, {"title": "Campo y potencial en distribuciones esféricas", "kicker": "COMPARACIÓN", "body": "<div class=\"tablewrap\"><table><tr><th>Sistema<\/th><th>Campo interior<\/th><th>Potencial interior<\/th><\/tr><tr><td>Maciza aislante uniformemente cargada<\/td><td>Crece linealmente con r<\/td><td>Varía cuadráticamente con r<\/td><\/tr><tr><td>Cáscara aislante uniformemente cargada<\/td><td>Nulo<\/td><td>Constante<\/td><\/tr><tr><td>Esfera conductora en equilibrio<\/td><td>Nulo<\/td><td>Constante<\/td><\/tr><\/table><\/div><p class=\"note\">Cavidades sin cargas interiores y geometrías esféricas ideales.<\/p>", "script": "En una esfera maciza aislante uniformemente cargada, la carga encerrada aumenta con el volumen y el campo crece linealmente hasta la superficie. Para una cáscara esférica ideal de carga uniforme, el campo interior es nulo. Una esfera conductora en equilibrio tampoco presenta campo en su material interior. El potencial puede ser constante sin necesariamente valer cero.", "kind": "concept", "sim": null}, {"title": "Potencial eléctrico y diferencia de potencial", "kicker": "ENERGÍA", "body": "<div class=\"formula\">V = U / q<\/div><div class=\"formula\">ΔV = ΔU / q<\/div><ul><li>El potencial es energía potencial eléctrica por unidad de carga.<\/li><li>Es una magnitud escalar.<\/li><li>La diferencia de potencial se mide en voltios.<\/li><\/ul>", "script": "El potencial eléctrico expresa la energía potencial por unidad de carga. A diferencia del campo eléctrico, es escalar. Una diferencia de potencial permite transformar energía eléctrica en trabajo o calor, según el sistema. Su unidad es el voltio, equivalente a joule por coulomb.", "kind": "concept", "sim": null}, {"title": "Conductores en equilibrio y efecto de punta", "kicker": "ELECTROSTÁTICA", "body": "<ul><li>En equilibrio electrostático, el campo en el material conductor es nulo.<\/li><li>El conductor es equipotencial.<\/li><li>La concentración superficial de carga y la intensidad del campo aumentan en zonas de gran curvatura.<\/li><li>El blindaje electrostático reduce el campo en regiones protegidas, bajo las condiciones adecuadas.<\/li><\/ul>", "script": "En un conductor en equilibrio, los portadores libres se redistribuyen hasta anular el campo dentro del metal. La superficie conductora queda al mismo potencial. En zonas de curvatura pronunciada puede aumentar la densidad superficial de carga y el campo eléctrico exterior. Este fenómeno es relevante para descargas, efecto corona y blindaje electrostático.", "kind": "concept", "sim": null}, {"title": "Corriente, resistencia y ley de Ohm", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">I = ΔQ / Δt<\/div><div class=\"formula\">V = R I<\/div><ul><li>Corriente convencional: sentido de transporte de carga positiva.<\/li><li>En metales, los electrones se desplazan en sentido opuesto.<\/li><li>La ley de Ohm describe una relación lineal bajo condiciones apropiadas.<\/li><\/ul>", "script": "La corriente eléctrica cuantifica la carga que cruza una sección por unidad de tiempo. En conductores metálicos los electrones se desplazan en sentido opuesto al convencional. La resistencia caracteriza la oposición al paso de corriente. Para un resistor óhmico y condiciones constantes, tensión, corriente y resistencia cumplen la ley de Ohm.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Ohm", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Resistencia, tensión, corriente y gráfico de Ohm<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Resistencia, tensión, corriente y gráfico de Ohm\" data-sim=\"s8\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Variemos tensión y resistencia para interpretar los resultados. Comprueben cómo aumenta la corriente con la tensión para una resistencia constante y qué sucede al cambiar la resistencia.", "kind": "lab", "sim": "s8"}, {"title": "Potencia y energía eléctrica", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">P = V I = I²R = V²/R<\/div><div class=\"formula\">W = P t<\/div><p>La energía eléctrica consumida puede expresarse en joules o kilowatt-hora.<\/p>", "script": "La potencia indica la rapidez con que se transfiere energía eléctrica. En una resistencia calefactora esa energía puede convertirse en calor. La energía acumulada depende de la potencia y del tiempo de operación. Estas relaciones resultan fundamentales para estimar consumos y cargas térmicas en equipos de alimentos.", "kind": "concept", "sim": null}, {"title": "Laboratorio: potencia y energía", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Consumo eléctrico y calentamiento resistivo<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Consumo eléctrico y calentamiento resistivo\" data-sim=\"s9\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Modifiquen la tensión, la resistencia y el tiempo. Comparen la potencia con la energía acumulada. Analicen cómo se relaciona el comportamiento del circuito con el calentamiento resistivo de un equipo.", "kind": "lab", "sim": "s9"}, {"title": "Circuitos: serie, paralelo y mixtos", "kicker": "CIRCUITOS", "body": "<ul><li>En serie, la misma corriente atraviesa cada elemento.<\/li><li>En paralelo, las ramas comparten diferencia de potencial.<\/li><li>Los circuitos mixtos combinan ambas configuraciones.<\/li><\/ul>", "script": "En un circuito serie no hay ramificaciones entre los elementos, por lo que circula la misma corriente. En paralelo, los elementos comparten los mismos nodos extremos y la misma diferencia de potencial. Los circuitos mixtos combinan estas configuraciones y requieren identificar equivalencias correctamente.", "kind": "concept", "sim": null}, {"title": "Laboratorio: circuitos resistivos", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Asociación de resistores en serie, paralelo y mixto<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Asociación de resistores en serie, paralelo y mixto\" data-sim=\"s10\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Comparen la resistencia equivalente y las corrientes para distintas configuraciones. Antes de calcular, identifiquen cuáles elementos realmente comparten corriente y cuáles comparten tensión.", "kind": "lab", "sim": "s10"}, {"title": "Leyes de Kirchhoff", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">Nodo: Σ I = 0<\/div><div class=\"formula\">Malla: Σ ΔV = 0<\/div><ul><li>Ley de nodos: conservación de la carga.<\/li><li>Ley de mallas: balance de energía en un recorrido cerrado.<\/li><li>Las corrientes elegidas pueden resultar negativas: indican sentido contrario.<\/li><\/ul>", "script": "Las leyes de Kirchhoff formalizan dos principios de conservación. En un nodo, la suma algebraica de corrientes es cero. En una malla cerrada, el balance algebraico de las diferencias de potencial es cero. Elegir sentidos de referencia permite resolver circuitos más complejos de forma sistemática.", "kind": "concept", "sim": null}, {"title": "Laboratorio: Kirchhoff", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Dos mallas resistivas con rama compartida<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Dos mallas resistivas con rama compartida\" data-sim=\"s11\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Modifiquen fuentes y resistencias en el circuito de dos mallas. Verifiquen las ecuaciones de cada malla y el balance de corriente de la rama compartida. Los signos de las corrientes son parte de la solución física.", "kind": "lab", "sim": "s11"}, {"title": "Magnetismo y fuerzas magnéticas", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">𝐅 = q(𝐯 × 𝐁)<\/div><ul><li>Las corrientes eléctricas generan campo magnético.<\/li><li>Sobre una carga en movimiento puede actuar una fuerza perpendicular a la velocidad y al campo.<\/li><li>Bobinas y conductores permiten construir electroimanes y motores.<\/li><\/ul>", "script": "El magnetismo puede manifestarse por imanes o por cargas en movimiento. Una carga móvil en un campo magnético experimenta una fuerza perpendicular a su velocidad y al campo. En conductores con corriente, estas fuerzas explican parte del funcionamiento de actuadores y motores.", "kind": "concept", "sim": null}, {"title": "Inducción electromagnética", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">ℰ = −N ΔΦ<sub>B<\/sub> / Δt<\/div><ul><li>Una variación de flujo magnético produce fuerza electromotriz inducida.<\/li><li>La ley de Lenz establece el sentido de oposición al cambio del flujo.<\/li><li>Fundamento de generadores, transformadores y numerosos sensores.<\/li><\/ul>", "script": "La inducción electromagnética aparece cuando cambia el flujo magnético enlazado con un circuito. Faraday relacionó la fuerza electromotriz con la rapidez de cambio de ese flujo. El signo negativo expresa la ley de Lenz: la corriente inducida se orienta de modo que su acción magnética se opone al cambio que la produce.", "kind": "concept", "sim": null}, {"title": "Laboratorio: inducción", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Variación de flujo y fuerza electromotriz inducida<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Variación de flujo y fuerza electromotriz inducida\" data-sim=\"s14\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Observen cómo cambia la fuerza electromotriz inducida cuando varía el flujo magnético. Comparen amplitud, frecuencia y número de espiras. Relacionen el resultado con la ley de Faraday.", "kind": "lab", "sim": "s14"}, {"title": "Instrumentación y sensores", "kicker": "TECNOLOGÍA DE ALIMENTOS", "body": "<ul><li>La cadena de medición transforma una variable física en una señal interpretable.<\/li><li>Pt100 y termocuplas permiten medir temperatura con principios diferentes.<\/li><li>Las señales de 4–20 mA se utilizan en instrumentación industrial.<\/li><li>El controlador interpreta la señal y puede actuar sobre calefacción, refrigeración o motores.<\/li><\/ul>", "script": "En los procesos alimentarios necesitamos medir temperatura, presión, nivel y otras variables. Un sensor responde a la magnitud; un acondicionador o transmisor adapta la señal; el controlador interpreta la medición. Una Pt100 varía su resistencia con la temperatura, mientras que una termocupla genera una diferencia de potencial termoeléctrica.", "kind": "concept", "sim": null}, {"title": "Caso integrador: tanque con calentamiento", "kicker": "APLICACIÓN INDUSTRIAL", "body": "<div class=\"labdesc\">Medición de temperatura y consumo eléctrico del calefactor<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Medición de temperatura y consumo eléctrico del calefactor\" data-sim=\"s16\" src=\"about:blank\"><\/iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.<\/p>", "script": "Analicen la cadena de medición y calentamiento. Cambien las condiciones del sensor y la resistencia calefactora. Relacionen la señal de medición, la ley de Ohm, la potencia eléctrica y la energía acumulada.", "kind": "lab", "sim": "s16"}, {"title": "Síntesis y preguntas para el cierre", "kicker": "CIERRE", "body": "<ul><li>¿Qué diferencia hay entre campo eléctrico y fuerza eléctrica?<\/li><li>¿Por qué en una esfera conductora la carga neta se ubica en su superficie exterior?<\/li><li>¿Puede haber potencial distinto de cero cuando el campo es nulo?<\/li><li>¿Qué evidencia aporta el electroscopio?<\/li><li>¿Cómo se aplican Kirchhoff y la ley de Ohm en una instalación de proceso?<\/li><\/ul>", "script": "Para cerrar, recuperamos las conexiones entre los conceptos. La carga es la fuente de interacción; el campo describe su acción espacial; el potencial permite una interpretación energética. Las mismas magnitudes hacen posible explicar circuitos, fenómenos magnéticos e instrumentación en la industria alimentaria.", "kind": "concept", "sim": null}];
let current=0,scriptOpen=false,voiceQueue=[],speechToken=0;const $=id=>document.getElementById(id),key=i=>'u7p_script_'+i;
const overrides={};try{Object.assign(overrides,JSON.parse(localStorage.getItem('u7presentation_scripts')||'{}'))}catch(e){}
function getScript(i){return Object.prototype.hasOwnProperty.call(overrides,i)?overrides[i]:slides[i].script}
function saveStore(){try{localStorage.setItem('u7presentation_scripts',JSON.stringify(overrides))}catch(e){}}
function stopSpeech(){speechToken++;voiceQueue=[];if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function render(i){stopSpeech();current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];$('sheet').className='sheet '+s.kind;$('kicker').textContent=s.kicker;$('heading').textContent=s.title;$('content').innerHTML=s.body;$('counter').textContent=(current+1)+' / '+slides.length;$('goto').value=String(current);$('prev').disabled=$('prev2').disabled=current===0;$('next').disabled=$('next2').disabled=current===slides.length-1;$('scriptbox').classList.toggle('visible',scriptOpen);$('scriptarea').value=getScript(current);document.title='Unidad 7 · '+s.title;location.hash='f'+(current+1);window.scrollTo(0,0);
// Load heavy simulations only when opened, avoiding dozens of WebGL contexts.
const sim=$('content').querySelector('iframe[data-sim]');if(sim){sim.src='assets/apunte_simulaciones.html?embed='+encodeURIComponent(sim.dataset.sim)+'#'+sim.dataset.sim}
const st=$('content').querySelector('iframe[data-static]');if(st){st.src=st.dataset.static}
}
function splitNarration(raw){return raw.match(/[^.!?\n]+(?:[.!?]+|\n|$)/g)?.map(s=>s.trim()).filter(Boolean)||[raw]}
function read(){stopSpeech();if(!('speechSynthesis' in window)){$('speechstatus').textContent='Síntesis de voz no disponible en este navegador';return;}const token=++speechToken;voiceQueue=splitNarration(getScript(current));let j=0;function next(){if(token!==speechToken)return;if(j>=voiceQueue.length){$('speechstatus').textContent='Lectura terminada.';return}const u=new SpeechSynthesisUtterance(voiceQueue[j++]);u.lang='es-AR';u.rate=+$('rate').value;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='es-AR')||voices.find(v=>v.lang?.startsWith('es'))||null;u.onend=next;u.onerror=e=>{$('speechstatus').textContent='La voz reportó un error: '+e.error;};$('speechstatus').textContent='Narrando filmina '+(current+1)+' · fragmento '+j+'/'+voiceQueue.length;window.speechSynthesis.speak(u)}next()}
for(const [id,step] of [['prev',-1],['prev2',-1],['next',1],['next2',1]])$(id).onclick=()=>render(current+step);
$('goto').onchange=e=>render(+e.target.value);$('speak').onclick=read;$('pause').onclick=()=>window.speechSynthesis?.pause();$('resume').onclick=()=>window.speechSynthesis?.resume();$('stop').onclick=stopSpeech;
$('toggleScript').onclick=()=>{scriptOpen=!scriptOpen;$('scriptbox').classList.toggle('visible',scriptOpen);if(scriptOpen)$('scriptarea').value=getScript(current)};
$('saveScript').onclick=()=>{overrides[current]=$('scriptarea').value;saveStore();$('speechstatus').textContent='Guion guardado en este navegador.'};$('resetScript').onclick=()=>{delete overrides[current];saveStore();$('scriptarea').value=getScript(current)};
$('exportScripts').onclick=()=>{const result=slides.map((s,i)=>({filmina:i+1,titulo:s.title,guion:getScript(i)}));let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='guiones_presentacion_unidad7.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importScripts').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('No es una lista');for(const item of data){const i=Number(item.filmina)-1;if(i>=0&&i<slides.length&&typeof item.guion==='string')overrides[i]=item.guion}saveStore();$('scriptarea').value=getScript(current);$('speechstatus').textContent='Guiones importados.'}catch(err){alert('Archivo inválido: '+err.message)}e.target.value=''};
slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;$('goto').appendChild(o)});const n=Number((location.hash||'').replace('#f',''))-1;render(Number.isInteger(n)&&n>=0?n:0);
window.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}});
