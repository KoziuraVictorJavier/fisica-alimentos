e{font-size:1.25rem;font-weight:750;color:#145c75}.infobox p{font-size:.88rem;color:#55778b}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.timeline span{padding:7px 10px;border:1px solid #c9e0e9;border-radius:8px;background:#f6fafb;font-size:.8rem}.diagram{border:1px solid #d4e6ec;border-radius:12px;width:100%;background:white}.labframe{display:block;width:100%;height:min(74vh,760px);min-height:530px;border:1px solid #c9dfe8;background:#fff;border-radius:13px}.posterimg{display:block;width:100%;height:auto;border:1px solid #d1e3ea;border-radius:14px;background:#fff;box-shadow:0 8px 24px #17364b12}.imgnote{margin-top:10px;color:#5f7b8b;font-size:.9rem}.imgstack{display:grid;gap:14px}.labdesc{padding:9px 0 17px;color:#376277}.tablewrap{width:100%;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.91rem}td,th{border-bottom:1px solid #dce6ed;padding:11px;text-align:left}th{background:#edf7f8}.bottom{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}.counter{color:#5f7b8b;font-variant-numeric:tabular-nums}.scriptarea{width:100%;min-height:190px;font:15px/1.55 system-ui;border:1px solid #a7c6d4;border-radius:9px;padding:12px;resize:vertical}.scriptbox{display:none;margin-top:18px;padding:18px;border:1px solid #b8d6e2;border-radius:14px;background:#f3fafc}.scriptbox.visible{display:block}.script-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.speechstatus{font-size:.76rem;color:#cee7ef;width:100%}.bar label{font-size:.82rem}.bar input[type=range]{width:78px;accent-color:#71d3d4}.sheet.cover{background:linear-gradient(145deg,#edf8fa,#fff 68%)}.sheet.lab{padding:clamp(16px,2.5vw,28px)}.sheet.lab h1{margin-bottom:10px;font-size:clamp(1.5rem,3vw,2.2rem)}.twodiag{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.twodiag .diagram{height:340px}.widegraph{display:block;width:100%;height:390px;border:1px solid #d4e6ec;border-radius:12px;background:white}.slideimg{display:block;width:100%;height:auto;border:1px solid #d4e6ec;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(23,54,75,.08)}.imgcaption{font-size:.92rem;color:#5f7b8b;margin-top:8px}.stackblock{display:grid;gap:12px}@media(max-width:860px){.twodiag{grid-template-columns:1fr}}@media(max-width:680px){.bar{position:relative;padding:9px}.brand{width:100%}.bar select{max-width:100%;width:100%}.body{padding:10px}.sheet{min-height:0;padding:18px}.content{font-size:1rem}.infobox{min-height:190px;gap:12px;padding:16px}.infoicon{font-size:2.5rem}.labframe{height:700px;min-height:600px}.bottom{margin-bottom:12px}}@media print{.bar,.bottom,.scriptbox{display:none!important}.sheet{box-shadow:none;min-height:auto}.body{padding:0}}

</style></head><body><div class="app"><header class="bar"><span class="brand">UTN · FÍSICA APLICADA · UNIDAD 7</span><select id="goto" aria-label="Ir a filmina"></select><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="speak">▶ Leer</button><button id="pause">⏸</button><button id="resume">⏵</button><button id="stop">■</button><button id="toggleScript">Editar guion</button><label>Voz <input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"></label><div class="speechstatus" id="speechstatus">Presentación v0.4: guiones ampliados activos. Los textos guardados en versiones anteriores se conservan por separado. Las expresiones matemáticas se leen mediante el guion.</div></header><div class="body"><article class="sheet" id="sheet"><div class="eyebrow" id="kicker"></div><h1 id="heading"></h1><div class="content" id="content"></div><div class="scriptbox" id="scriptbox"><label for="scriptarea"><b>Guion ampliado v0.4 de la filmina — editable</b></label><textarea id="scriptarea" class="scriptarea"></textarea><div class="script-buttons"><button id="saveScript">Guardar</button><button id="resetScript">Restablecer</button><button id="exportScripts">Exportar JSON</button><button id="importScripts">Importar JSON</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div></article><nav class="bottom"><button id="prev2">← Anterior</button><span class="counter" id="counter"></span><button id="next2">Siguiente →</button></nav></div></div><script>
const slides=[{"title": "Electricidad aplicada", "kicker": "UNIDAD 7 · TECNICATURA EN ALIMENTOS", "body": "<p class=\"lead\">De la carga eléctrica a los campos, los circuitos y la instrumentación de los procesos alimentarios.</p><ul><li>Conceptos explicados desde fenómenos observables</li><li>Simbología eléctrica, ecuaciones y aplicaciones industriales</li><li>Simuladores interactivos y actividades de interpretación</li></ul>", "script": "Presentamos la unidad siete, Electricidad aplicada. Partiremos de la electrización y la noción de campo. Luego relacionaremos fuerza, campo y potencial, estudiaremos materiales y circuitos, y terminaremos con electromagnetismo e instrumentación. Cada simulación permite modificar parámetros y observar las consecuencias físicas.", "kind": "cover", "sim": null}, {"title": "Objetivos y recorrido", "kicker": "ORIENTACIÓN", "body": "<ul><li>Distinguir carga, fuerza, campo y potencial eléctrico.</li><li>Interpretar conductores, aislantes y distribución de carga en geometrías esféricas.</li><li>Explicar la electrización, la inducción y el funcionamiento del electroscopio.</li><li>Aplicar la ley de Ohm y las leyes de Kirchhoff.</li><li>Reconocer los principios de sensores y actuadores eléctricos.</li></ul>", "script": "En esta presentación retomamos la secuencia conceptual completa de la unidad. Primero estudiaremos cómo se electrizan los cuerpos y qué significa hablar de carga eléctrica. Después introduciremos la noción de campo, que permite describir la acción de una carga sobre el espacio sin necesidad de imaginar un contacto directo. A continuación relacionaremos fuerza, campo y potencial, y analizaremos cómo cambian estas magnitudes en geometrías simples, sobre todo en distribuciones esféricas. En el segundo bloque pasaremos a corriente, ley de Ohm, potencia, circuitos y leyes de Kirchhoff. Finalmente cerraremos con magnetismo, inducción e instrumentación, conectando todo con aplicaciones en tecnología de alimentos. La intención no es recitar fórmulas, sino comprender qué magnitudes intervienen, qué hipótesis estamos usando y qué significado físico tiene cada resultado.", "kind": "concept", "sim": null}, {"title": "Historia de la electricidad y el magnetismo", "kicker": "MARCO HISTÓRICO", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/historia_electricidad_magnetismo.png\" alt=\"Infografía: historia de la electricidad y el magnetismo\"><p class=\"imgnote\">La línea de tiempo resume hitos desde las observaciones antiguas del ámbar y la magnetita hasta la síntesis del electromagnetismo y su verificación experimental.</p></div>", "script": "Esta infografía explica cómo el conocimiento eléctrico y magnético pasó de observaciones cotidianas a una teoría física capaz de predecir fenómenos. No se trató de un descubrimiento aislado, sino de una construcción colectiva apoyada en instrumentos, experimentos y leyes matemáticas.\nComenzamos en la Antigüedad. El ámbar frotado podía atraer pequeños objetos y la magnetita atraía hierro. Son dos fenómenos distintos: uno está relacionado con la electrización y el otro con las propiedades magnéticas de ciertos materiales. En ese momento todavía no existía una teoría que los relacionara.\nEn 1600, William Gilbert publicó De Magnete. Realizó un estudio sistemático de los imanes y describió la Tierra como un gran imán. La importancia de su trabajo fue reemplazar parte de las explicaciones especulativas por observaciones y ensayos reproducibles.\nEn 1785, Charles-Augustin de Coulomb cuantificó la interacción entre cargas utilizando una balanza de torsión. Encontró que, en el modelo de cargas puntuales, la magnitud de la fuerza disminuye con el cuadrado de la distancia. Esta ley permitió calcular fuerzas en lugar de limitarse a describir atracciones o repulsiones.\nEn 1800, Alessandro Volta desarrolló la pila voltaica. Hasta entonces, buena parte de los experimentos trabajaba con descargas breves de electricidad estática. La pila hizo posible sostener corrientes durante un tiempo suficiente para estudiar los circuitos.\nEn 1820, Hans Christian Ørsted observó que una corriente eléctrica desvía la aguja de una brújula. Esto reveló una relación directa entre electricidad y magnetismo. André-Marie Ampère investigó luego las fuerzas entre corrientes y contribuyó a formular cuantitativamente esa relación.\nEn 1827, Georg Ohm publicó la relación entre tensión, corriente y resistencia para ciertos conductores bajo condiciones definidas. Aunque en el póster su figura aparezca después de Faraday, cronológicamente el trabajo de Ohm es anterior al descubrimiento de la inducción de 1831.\nEn 1831, Michael Faraday mostró que un flujo magnético variable puede originar una fuerza electromotriz inducida. La pregunta clave pasó a ser no solo qué campo existe, sino cómo cambia y qué efectos produce su variación. Allí se encuentra el fundamento de los generadores y transformadores.\nEn 1845, Gustav Kirchhoff formuló las leyes que hoy utilizamos para estudiar la conservación de carga y los balances de tensión en circuitos concentrados. Entre 1861 y 1865, James Clerk Maxwell reunió los resultados experimentales y teóricos en una descripción unificada del campo electromagnético. Su teoría predijo la existencia de ondas electromagnéticas que se propagan por el espacio.\nEn 1887 y 1888, Heinrich Hertz generó y detectó esas ondas experimentalmente, aportando una comprobación decisiva de las predicciones de Maxwell.\nComo conclusión, observamos una secuencia científica: primero se identifica un fenómeno, luego se mide, se formula una ley y finalmente se integra en una teoría más general. En esta unidad seguiremos ese recorrido, desde la carga y el campo hasta la corriente, los circuitos, el magnetismo y la inducción.", "kind": "infographic", "sim": null}, {"title": "Un concepto que reúne muchos fenómenos: campo", "kicker": "CAMPO FÍSICO", "body": "<p class=\"lead\">Un campo asigna un valor físico a cada punto de una región del espacio.</p><ul><li><b>Escalar:</b> temperatura, presión, potencial eléctrico.</li><li><b>Vectorial:</b> campo gravitatorio, eléctrico o magnético.</li><li>Las flechas representan dirección, sentido e intensidad; las líneas de campo son una representación geométrica.</li></ul>", "script": "La idea de campo aparece cuando queremos describir cómo una fuente modifica las condiciones físicas del espacio que la rodea. Un campo asigna un valor a cada punto: si el valor es solamente numérico, hablamos de un campo escalar, como la temperatura o el potencial eléctrico. Si en cada punto debemos indicar además dirección y sentido, hablamos de un campo vectorial, como el campo gravitatorio, eléctrico o magnético. Esta forma de describir el fenómeno es poderosa porque separa dos cuestiones: por un lado, la fuente que genera el campo; por otro, el cuerpo de prueba que responde cuando lo ubicamos en ese lugar. En vez de pensar la interacción a distancia como algo misterioso, pensamos que la fuente establece una cierta estructura espacial, y que cada partícula responde localmente a esa estructura.", "kind": "concept", "sim": null}, {"title": "Infografía: campo escalar y vectorial", "kicker": "CAMPO · APOYO VISUAL", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/concepto_campo.png\" alt=\"Infografía: concepto de campo\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/campo_concepto.html\" style=\"height:300px\"></iframe><p class=\"imgnote\">La infografía integra campo escalar, campo vectorial, modos de representación y la idea de superposición.</p></div>", "script": "Esta infografía introduce uno de los conceptos más importantes de toda la unidad: el campo físico. Un campo permite asignar una magnitud a cada punto de una región del espacio, aunque en ese lugar no coloquemos un instrumento o un objeto de prueba. También puede variar con el tiempo.\nPrimero observamos el campo escalar. Una magnitud escalar queda determinada por un valor y una unidad, sin dirección espacial asociada. La temperatura en una cámara frigorífica es un ejemplo cercano a la tecnología de alimentos. No necesariamente toda la cámara tiene la misma temperatura: una puerta, una pared caliente o la circulación deficiente del aire pueden crear regiones más cálidas o más frías. El mapa de colores representa justamente esa distribución. Otros campos escalares son la presión de un fluido y la concentración de una sustancia.\nEn segundo lugar aparece el campo vectorial. En cada punto se asigna un vector con módulo, dirección y sentido. El campo gravitatorio indica la fuerza por unidad de masa que experimentaría una pequeña masa de prueba. El campo eléctrico indica la fuerza por unidad de carga positiva de prueba. También el campo de velocidades de un fluido es vectorial, porque el aire puede desplazarse con rapidez y orientación diferentes en cada punto.\n¿Cómo se representa un campo? Una posibilidad es dibujar flechas en puntos de una cuadrícula. Su orientación indica el sentido y su longitud, cuando así se acuerda, puede representar la magnitud. Otra posibilidad son las líneas de campo. La tangente a cada línea indica la dirección local del vector. Por convenio, el espaciamiento de las líneas puede ayudar a representar la intensidad. Son herramientas geométricas, no objetos materiales ni trayectorias obligatorias.\nLa infografía también muestra superficies equipotenciales. En electrostática, sobre cada una de ellas el potencial eléctrico tiene el mismo valor. Las superficies equipotenciales son perpendiculares a las líneas de campo donde el campo no es nulo; esta relación se profundizará cuando estudiemos potencial.\nEl siguiente concepto es la superposición. Si varias fuentes generan un campo eléctrico, el campo resultante en un punto es la suma vectorial de los campos individuales. Esto obliga a considerar dirección y sentido; no basta sumar las intensidades como números positivos. Dos contribuciones pueden reforzarse o cancelarse en ciertos puntos.\nFinalmente comparamos gravedad y electricidad. La relación fuerza gravitatoria igual a masa por campo gravitatorio permite recuperar algo ya estudiado en mecánica. De manera análoga, fuerza eléctrica igual a carga por campo eléctrico relaciona la respuesta de una carga con el campo creado por otras. La semejanza es conceptual, pero hay una diferencia importante: la masa gravitatoria es positiva en estos modelos, mientras que la carga eléctrica puede ser positiva o negativa. Por eso una carga negativa experimenta una fuerza opuesta al campo eléctrico.\nLa idea que debemos conservar es que el campo caracteriza la influencia de las fuentes en el espacio y la fuerza describe lo que experimenta el cuerpo de prueba cuando lo colocamos allí. Esta distinción evita confundir causa, representación y respuesta física.", "kind": "infographic", "sim": null}, {"title": "Campo gravitatorio como referencia", "kicker": "CAMPO FÍSICO", "body": "<div class=\"formula\">𝐅<sub>g</sub> = m 𝐠</div><div class=\"formula\">𝐠 ≈ (0; −9,81; 0) N/kg</div><p>Se adopta eje vertical positivo hacia arriba y una región pequeña próxima a la superficie terrestre.</p>", "script": "Conviene comenzar con un ejemplo conocido. Cerca de la superficie terrestre, la Tierra genera un campo gravitatorio aproximadamente uniforme. Si colocamos una masa en esa región, la fuerza que experimenta es el peso, y vale masa por campo gravitatorio. Ese ejemplo nos sirve para distinguir con claridad campo y fuerza. El campo gravitatorio es una propiedad de la región del espacio generada por la Tierra; la fuerza aparece cuando ubicamos una masa en ese campo. Además, el ejemplo muestra una idea que luego reaparece en electrostática: una misma estructura conceptual permite describir situaciones diferentes. Más adelante, al escribir fuerza eléctrica igual carga por campo eléctrico, recuperaremos una analogía directa con esta expresión gravitatoria.", "kind": "concept", "sim": null}, {"title": "Video experimental: 10 experimentos de electrostática", "kicker": "OBSERVACIÓN EXPERIMENTAL · ELECTROSTÁTICA", "kind": "video", "sim": null, "body": "<p class=\"lead\">Antes de formalizar el concepto de carga eléctrica, observemos algunos fenómenos de electrostática.</p><video class=\"experimentvideo\" controls playsinline preload=\"metadata\" aria-label=\"Video: 10 experimentos de electrostática\"><source src=\"assets/10_Experimentos_de_Electrostatica.mp4\" type=\"video/mp4\">Este navegador no admite reproducción de video HTML5.</video><p class=\"videosource\"><strong>Origen del video:</strong> <a href=\"https://www.youtube.com/watch?v=rZN8EOp0nFU\" target=\"_blank\" rel=\"noopener noreferrer\">10 Experimentos de Electrostática — publicación original en YouTube</a>. Archivo MP4 proporcionado para su uso en esta presentación.</p><div class=\"note\"><strong>Preguntas para observar:</strong> ¿Qué cuerpos se atraen o repelen? ¿Hay contacto? ¿Qué papel cumplen el material y la humedad? ¿Cómo distinguir carga neta de polarización?</div>", "script": "Antes de estudiar formalmente la carga eléctrica, observaremos un conjunto de demostraciones experimentales tomadas del video titulado Diez experimentos de electrostática. La fuente de origen está identificada debajo del reproductor mediante el enlace a YouTube. Durante la reproducción no se pretende identificar de antemano el resultado de cada ensayo; se trata de observar y describir. Preguntemos qué materiales intervienen, si los cuerpos se tocan, si hay atracción o repulsión, y qué sucede cuando cambia la distancia. También conviene distinguir lo que efectivamente vemos de la explicación física que propondremos después. Un objeto neutro puede experimentar atracción por polarización, por lo que una atracción observada no demuestra por sí sola que ambos cuerpos estén cargados con signos opuestos. Después del video relacionaremos estas observaciones con la estructura de la materia, la transferencia de electrones, la conservación de la carga, la electrización por frotamiento, contacto e inducción, y la diferencia entre conductores y aislantes. El video constituye una introducción experimental, no reemplaza la fundamentación teórica."}, {"title": "Carga eléctrica: qué es y cómo se conserva", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">q = n e</div><ul><li>Existen cargas positivas y negativas.</li><li>La electrización modifica el balance de cargas; no crea carga neta.</li><li>En sólidos, la transferencia suele involucrar electrones.</li></ul>", "script": "La carga eléctrica es una propiedad de la materia responsable de las interacciones electromagnéticas. En la materia ordinaria encontramos protones con carga positiva y electrones con carga negativa. Un cuerpo neutro contiene ambas en igual cantidad, aunque eso no significa que no pueda electrizarse. Cuando un cuerpo gana electrones queda con carga neta negativa; cuando pierde electrones, con carga neta positiva. Un punto fundamental es la conservación de la carga: en un sistema aislado no se crea ni se destruye carga neta, sino que se redistribuye. En muchos procesos de electrización de sólidos lo que realmente se transfiere son electrones. La expresión q igual n por e recuerda, además, que la carga está cuantizada: aparece como múltiplo entero de la carga elemental.", "kind": "concept", "sim": null}, {"title": "Formas de electrización", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/carga_electrica_electrizacion.png\" alt=\"Infografía: carga eléctrica y formas de electrización\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/cargas_transferencia.html\" style=\"height:250px\"></iframe><ul><li><b>Frotamiento:</b> transferencia de electrones entre materiales.</li><li><b>Contacto:</b> redistribución de carga al tocar un conductor cargado con otro cuerpo.</li><li><b>Inducción:</b> redistribución sin contacto; para una carga neta permanente puede intervenir una puesta a tierra.</li></ul></div>", "script": "En esta infografía comenzamos definiendo la carga eléctrica, una propiedad física de la materia que permite explicar atracciones y repulsiones eléctricas. Existen dos signos, positivo y negativo. Dos cargas del mismo signo se repelen; cargas de signos contrarios se atraen. En un cuerpo neutro, las contribuciones positivas y negativas se compensan.\nLa carga eléctrica está cuantizada. La expresión q igual a n multiplicado por e indica que la carga neta de un cuerpo ordinario corresponde a un múltiplo entero, con signo, del módulo de la carga elemental. Ese módulo vale aproximadamente uno coma seiscientos dos por diez elevado a menos diecinueve coulomb. El electrón tiene carga negativa, de signo menos; el protón tiene carga positiva. La fórmula utiliza e como módulo positivo.\nEl segundo punto es la conservación de la carga. En un sistema aislado, la suma algebraica total de cargas permanece constante. Por eso electrizar dos objetos no significa crear carga: usualmente significa transferir electrones o redistribuir los que ya existen. Si un cuerpo pierde electrones, queda con carga neta positiva; si gana electrones, queda con carga neta negativa.\nLa primera forma de electrización es por frotamiento. Al entrar en contacto y separarse dos materiales diferentes, puede producirse transferencia de electrones. El frotamiento aumenta las oportunidades de contacto, pero no es una fábrica de electrones. La cantidad y el signo de la carga dependen de los materiales y de sus superficies.\nLa segunda forma es por contacto. Un cuerpo cargado toca otro y se habilita el intercambio de carga. En el caso sencillo de dos conductores inicialmente aislados, uno cargado y otro neutro, las cargas se redistribuyen hasta alcanzar un equilibrio. No debemos suponer que siempre quedan con exactamente la misma carga: el resultado depende de su geometría y capacidad eléctrica.\nLa tercera forma es por inducción. Un cuerpo cargado cercano produce una redistribución de cargas en un conductor sin tocarlo. Esto se llama separación o polarización de cargas. Por sí sola, esa redistribución no implica que el conductor adquiera carga neta. Para obtener una carga neta permanente, puede conectarse a tierra mientras el inductor permanece cerca, retirar la conexión a tierra y finalmente alejar el inductor. El orden de las acciones importa.\nLa siguiente sección presenta la fuerza eléctrica. Coulomb determinó que el módulo de la fuerza entre dos cargas puntuales estacionarias en el vacío es igual a k por el valor absoluto del producto de las cargas dividido por la distancia al cuadrado. El valor absoluto se utiliza cuando hablamos del módulo; los signos determinan si la interacción es atractiva o repulsiva. Al duplicar la distancia, la fuerza pasa a ser una cuarta parte.\nTambién debemos comprender la polarización. Un cuerpo inicialmente neutro puede reorganizar levemente sus cargas ante un campo exterior. Esa distribución inducida puede producir una atracción neta, aunque la carga total del cuerpo siga siendo cero.\nTerminamos con una aplicación industrial: en el transporte de polvos, granos o materiales de envase puede acumularse electricidad estática por contacto y separación de superficies. Esa acumulación puede atraer partículas, interferir con operaciones o generar descargas. En zonas con atmósferas potencialmente explosivas se requieren evaluaciones de riesgo y medidas de prevención adecuadas. La conexión a tierra de partes conductoras es importante, pero no elimina por sí sola todos los riesgos de carga en materiales aislantes.\nLa conclusión es que la electrización se interpreta mejor observando qué cargas se transfieren, qué cargas solo se redistribuyen y qué condiciones permiten que el cuerpo mantenga su estado eléctrico.", "kind": "infographic", "sim": null}, {"title": "Material conductor y material aislante", "kicker": "MATERIALES", "body": "<ul><li><b>Conductor:</b> dispone de portadores de carga con gran movilidad; en metales son electrones.</li><li><b>Aislante:</b> dificulta el transporte macroscópico de carga, pero puede polarizarse.</li><li>El comportamiento depende del material, las condiciones y la geometría.</li></ul><p class=\"note\">Ejemplos: cobre y aluminio como conductores; vidrio seco, muchos plásticos y cerámicas como aislantes.</p>", "script": "Para comprender cómo se distribuye la carga, no alcanza con saber cuánta carga hay: también debemos conocer el material. En un conductor existen portadores con suficiente movilidad como para desplazarse macroscópicamente por el cuerpo. En metales, esos portadores son principalmente electrones libres. En un aislante o no conductor, en cambio, ese movimiento está muy limitado. Sin embargo, eso no significa que el aislante sea indiferente al campo eléctrico: puede polarizarse, es decir, deformar ligeramente la distribución interna de sus cargas positivas y negativas. Esta diferencia explica por qué un exceso de carga puede redistribuirse por toda la superficie de un conductor en equilibrio, mientras que en un aislante puede quedar más localizado en la región donde se depositó.", "kind": "concept", "sim": null}, {"title": "Comparación de materiales y cargas", "kicker": "MATERIALES · INFOGRAFÍA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/conductores_aislantes_electroscopio.png\" alt=\"Infografía: conductores, aislantes y electroscopio\"><p class=\"imgnote\">La lámina vincula movilidad de cargas, polarización y funcionamiento del electroscopio de hojas como detector cualitativo de carga.</p></div>", "script": "Esta infografía compara conductores, aislantes, polarización y electroscopio. El punto de partida es distinguir el material de la geometría, porque ambos influyen en la distribución de cargas.\nUn conductor posee portadores de carga que pueden desplazarse relativamente fácilmente. En un metal, los portadores móviles son principalmente electrones. Por eso una perturbación eléctrica provoca una redistribución de carga hasta alcanzar, si el sistema queda en reposo electrostático, una configuración de equilibrio. El cobre es un ejemplo habitual. También existen conductores cuya conducción depende de iones, como muchas soluciones acuosas con sales.\nUn aislante o no conductor presenta gran dificultad para el desplazamiento macroscópico de cargas. Vidrio seco y ciertos plásticos son ejemplos, aunque ningún aislante real tiene resistencia infinita. La humedad, la temperatura y la contaminación superficial pueden modificar mucho su comportamiento. Si se deposita carga sobre un aislante, puede permanecer localizada, en lugar de repartirse rápidamente por todo el cuerpo.\nEl tercer concepto es la polarización. Cuando acercamos una varilla cargada a un cuerpo aislante neutro, sus cargas ligadas pueden desplazarse ligeramente en sentidos opuestos, o sus dipolos orientarse. Se genera así una distribución microscópica de dipolos sin que necesariamente cambie la carga neta total. La polarización explica por qué un objeto neutro puede experimentar atracción hacia otro cargado.\nA continuación observamos el electroscopio de hojas. Está formado por un terminal metálico superior, una varilla conductora, dos hojas metálicas delgadas y una envolvente aislante que las protege. Si el sistema recibe una carga neta, esta se redistribuye por sus partes conductoras y las hojas pueden quedar con carga del mismo signo. Entonces se repelen y se separan.\nLa apertura angular surge de un equilibrio entre repulsión eléctrica y las fuerzas mecánicas asociadas al peso y la geometría de las hojas. En general una mayor carga produce una mayor apertura, pero no existe una ley universal sencilla que relacione directamente ángulo y cantidad de carga para cualquier aparato. Por eso el electroscopio tradicional es principalmente un detector cualitativo, no un medidor de alta precisión.\nVeamos los tres pasos representados. Primero, cargar: al tocar el terminal con un objeto cargado puede transferirse carga. Segundo, acercar: un objeto cargado próximo, aunque no toque el terminal, puede redistribuir las cargas y modificar la separación de las hojas. Si el electroscopio ya estaba cargado, esa separación puede aumentar o disminuir según el signo y la distribución inicial. Tercero, descargar o conectar a tierra: se permite el intercambio de carga con el entorno, y al restablecerse el estado neutro, en condiciones ideales, las hojas vuelven a quedar juntas.\nEn el simulador que acompaña a la presentación podemos modificar la carga y observar la variación del ángulo. El modelo debe interpretarse como una aproximación didáctica de equilibrio mecánico-electrostático, no como una calibración de un instrumento real.\nLa idea esencial de esta lámina es que la movilidad de cargas explica los fenómenos macroscópicos. La redistribución rápida en conductores, la polarización de aislantes y la apertura de hojas del electroscopio son distintas manifestaciones de interacciones eléctricas.", "kind": "infographic", "sim": null}, {"title": "Distribución de cargas en esferas", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/distribucion_cargas_esferas.png\" alt=\"Infografía: distribución de cargas en esferas\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/esferas.html\" style=\"height:360px\"></iframe><p class=\"imgnote\">La comparación distingue los casos conductor y no conductor, macizo y hueco, incluyendo campo interior, potencial y efecto de punta.</p></div>", "script": "La geometría esférica es especialmente útil porque posee alta simetría y permite comparar materiales distintos. En una esfera conductora aislada en equilibrio electrostático, la carga neta excedente se ubica en la superficie exterior. Si la esfera es hueca y no hay carga en la cavidad, el resultado sigue siendo el mismo: el campo en la cavidad es nulo y la carga queda afuera. En una esfera maciza aislante con carga volumétrica uniforme, en cambio, la carga está distribuida en todo el volumen, de modo que la carga encerrada crece con el radio. En una cáscara aislante ideal, la carga puede modelarse como distribuida uniformemente sobre la superficie. Estas diferencias producen comportamientos distintos de campo y potencial en el interior.", "kind": "infographic", "sim": null}, {"title": "Fuerza eléctrica: ley de Coulomb", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">F = k |q₁q₂| / r²</div><ul><li>Para cargas puntuales estacionarias, la fuerza actúa sobre la recta que las une.</li><li>Mismo signo: repulsión; signos opuestos: atracción.</li><li>La distancia interviene al cuadrado.</li></ul>", "script": "La ley de Coulomb cuantifica la interacción entre dos cargas puntuales en reposo. El módulo de la fuerza crece con los módulos de las cargas y disminuye con el cuadrado de la distancia que las separa. La fuerza siempre actúa sobre la recta que une las cargas: si tienen el mismo signo, la interacción es repulsiva; si tienen signo opuesto, es atractiva. Aunque la ecuación parece simple, encierra varias ideas importantes. Primero, que la interacción depende de una constante del medio; en vacío o aire suele utilizarse la constante k. Segundo, que la ley es vectorial: para resolver problemas reales debemos considerar dirección y sentido. Y tercero, que sirve como base para definir luego el campo eléctrico como fuerza por unidad de carga de prueba positiva.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Coulomb", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Fuerza eléctrica entre dos cargas</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Fuerza eléctrica entre dos cargas\" data-sim=\"s4\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En esta simulación conviene trabajar con dos preguntas. La primera es cómo cambia el módulo de la fuerza cuando modificamos una sola variable y mantenemos las demás constantes. Si duplicamos una de las cargas, la fuerza se duplica; si duplicamos la distancia, la fuerza disminuye a la cuarta parte. La segunda pregunta es cómo cambia el sentido de la interacción al cambiar el signo de las cargas. Observen que la simulación no solamente entrega números: permite vincular la expresión matemática con el comportamiento físico de atracción y repulsión. Intenten anticipar el resultado antes de mover los controles, y luego comparen la predicción con el valor calculado.", "kind": "lab", "sim": "s4"}, {"title": "Electroscopio de hojas", "kicker": "ELECTROSTÁTICA", "body": "<ul><li>Detecta electrización por separación de dos hojas conductoras.</li><li>La repulsión eléctrica tiende a abrirlas; las acciones mecánicas se oponen.</li><li>Puede cargarse por contacto y experimentar polarización por inducción.</li></ul>", "script": "El electroscopio de hojas metálicas es un instrumento cualitativo para detectar electrización y comparar estados de carga. Está formado por un terminal conductor, una varilla y dos hojas muy livianas. Cuando el sistema recibe carga, ésta se redistribuye por el conductor y ambas hojas quedan con carga del mismo signo. Como cargas del mismo signo se repelen, las hojas se separan. La apertura angular no es arbitraria: surge de un equilibrio entre la repulsión eléctrica y las acciones mecánicas que tienden a cerrar las hojas, como el peso y la geometría del sistema. El electroscopio también permite discutir electrización por contacto, por inducción y descarga a tierra, por eso funciona como un excelente puente entre los conceptos microscópicos y la evidencia experimental visible.", "kind": "concept", "sim": null}, {"title": "Laboratorio: cargar y descargar un electroscopio", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Electroscopio de hojas: carga, descarga e inducción</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Electroscopio de hojas: carga, descarga e inducción\" data-sim=\"selectro\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En el laboratorio del electroscopio conviene observar la secuencia completa. Partan del estado neutro y carguen el instrumento con un signo determinado: las hojas se abren porque ambas adquieren carga del mismo signo. Luego descarguen o conecten a tierra y verifiquen que la apertura disminuye. Ensayen también la aproximación de un cuerpo cargado sin contacto. Allí no necesariamente se transfiere carga neta; puede aparecer una redistribución inducida. La gráfica de apertura angular frente a la carga ayuda a recordar que el modelo es pedagógico: busca representar la tendencia física general, no reproducir con exactitud metrológica un instrumento comercial.", "kind": "lab", "sim": "selectro"}, {"title": "Campo eléctrico y líneas de campo", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">𝐄 = 𝐅 / q<sub>prueba</sub></div><ul><li>El vector <b>campo eléctrico</b> indica la fuerza por unidad de carga de prueba positiva.</li><li>Las <b>líneas de campo</b> muestran dirección y sentido del campo en cada punto.</li><li>Las <b>superficies equipotenciales</b> unen puntos de igual potencial y son perpendiculares al campo.</li></ul><div class=\"twodiag\"><iframe class=\"diagram\" title=\"Líneas de campo de cargas positiva y negativa\" src=\"assets/campo_pos_neg.html\"></iframe><iframe class=\"diagram\" title=\"Líneas de campo y equipotenciales\" src=\"assets/lineas_equipotenciales.html\"></iframe></div>", "script": "El campo eléctrico se define como la fuerza por unidad de carga de prueba positiva. Eso significa que, si conociéramos el campo en un punto, podríamos anticipar qué fuerza actuaría sobre una pequeña carga positiva colocada allí. Las líneas de campo son una herramienta gráfica para representar esa información. La tangente a la línea da la dirección del campo, y el sentido de la flecha indica hacia dónde actuaría la fuerza sobre una carga de prueba positiva. En regiones donde dibujamos más líneas por unidad de área, interpretamos cualitativamente un campo más intenso. Estas líneas no son objetos materiales ni trayectorias obligatorias; son una forma de visualizar el campo. Junto a ellas aparecen las líneas o superficies equipotenciales, que unen puntos con igual potencial y resultan perpendiculares al campo.", "kind": "concept", "sim": null}, {"title": "Superposición de campos", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">𝐄<sub>R</sub> = 𝐄₁ + 𝐄₂ + …</div><ul><li>La suma es vectorial: deben considerarse módulo, dirección y sentido.</li><li>En puntos de simetría puede haber cancelación parcial o total.</li><li>Campo nulo no implica ausencia de cargas; significa que los aportes se compensan en ese punto.</li></ul><p class=\"note\">En el análisis conviene dibujar cada vector campo antes de realizar la suma.</p>", "script": "Cuando varias cargas están presentes, cada una contribuye con su propio campo en el punto de interés. El campo total no se obtiene sumando solamente números, sino realizando una suma vectorial. Por eso, en un problema de superposición conviene dibujar primero el campo aportado por cada fuente, con su dirección y sentido. En puntos de simetría puede ocurrir que dos o más contribuciones se anulen exactamente, de modo que el campo resultante sea nulo aunque ninguna de las cargas individuales deje de existir. Esta idea es muy importante: campo nulo no significa ausencia de fuentes, sino compensación entre aportes. La superposición es un principio general y reaparece luego en circuitos, magnetismo y otras áreas de la física.", "kind": "concept", "sim": null}, {"title": "Ley de Gauss: idea física", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">∮<sub>S</sub> 𝐄 · d𝐀 = Q<sub>enc</sub> / ε₀</div><ul><li>El flujo eléctrico cuantifica cuántas líneas de campo atraviesan una superficie cerrada.</li><li>La ley de Gauss es siempre válida, pero es especialmente útil cuando existe simetría.</li><li>La carga que importa es la <b>encerrada</b> por la superficie, no la que queda fuera.</li></ul><p class=\"note\">En distribuciones esféricas, cilíndricas o planas, la simetría permite elegir superficies gaussianas que simplifican el cálculo.</p>", "script": "La ley de Gauss relaciona el flujo del campo eléctrico a través de una superficie cerrada con la carga neta encerrada en su interior. El flujo puede interpretarse, en forma cualitativa, como una medida de cuántas líneas de campo atraviesan la superficie, teniendo en cuenta la orientación local de la superficie. La ley siempre es verdadera, pero su utilidad práctica depende de la simetría. Cuando el sistema es esférico, cilíndrico o plano, podemos elegir superficies gaussianas en las que el módulo del campo es constante o tiene una orientación simple. Entonces la integral se simplifica notablemente. Un detalle crucial es que la ley depende de la carga encerrada: cargas externas pueden modificar la forma local del campo, pero no cambian el flujo neto asociado a la carga interna de la superficie elegida.", "kind": "concept", "sim": null}, {"title": "Laboratorio 3D: esfera uniformemente cargada", "kicker": "SIMULACIÓN 3D · GAUSS", "body": "<div class=\"labdesc\">Simulador original de la esfera maciza aislante con carga volumétrica uniforme, campo y potencial.</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulador tridimensional de Gauss\" data-static=\"assets/gauss.html\" src=\"about:blank\"></iframe><p class=\"muted\">Three.js y MathJax requieren conexión a Internet en esta versión del simulador.</p>", "script": "Este simulador debe leerse a la luz de la hipótesis del modelo: se trata de una esfera maciza aislante con carga distribuida uniformemente en el volumen. No describe una esfera conductora. Al variar el radio de la superficie gaussiana, observen tres regiones. Dentro de la esfera, la carga encerrada crece con el volumen y por eso el campo aumenta con el radio. En la superficie se alcanza el valor máximo del campo. Fuera de la esfera, toda la carga ya está encerrada y el campo decrece como uno sobre r cuadrado, igual que para una carga puntual equivalente. Comparen además el gráfico del potencial. Allí verán que el potencial es continuo y que su comportamiento interior difiere claramente del caso conductor.", "kind": "lab", "sim": "gauss"}, {"title": "Campo y potencial en distribuciones esféricas", "kicker": "COMPARACIÓN", "body": "<p class=\"lead\">Tres objetos con <b>la misma carga total positiva Q</b> y <b>el mismo radio R</b>: ¿qué ocurre dentro, en la superficie y fuera?</p><div class=\"note\"><b>Cómo leer:</b> el eje horizontal es r/R; la línea vertical marca r=R. El campo y el potencial se expresan en escalas relativas para comparar formas, no valores absolutos.</div><iframe class=\"widegraph\" style=\"height:clamp(760px,115vh,1250px)\" title=\"Comparación explicada de campo y potencial de tres distribuciones esféricas\" src=\"assets/potencial_esferas_didactico.html\"></iframe><p class=\"note\"><b>Idea física:</b> campo nulo significa potencial <i>constante</i>, no necesariamente potencial cero. El potencial es continuo en la superficie de los tres modelos; el campo puede presentar un salto en una capa superficial cargada.</p>", "script": "Vamos a comparar tres objetos que poseen la misma carga positiva total Q y el mismo radio exterior R. Adoptaremos como referencia el potencial cero en el infinito. La distancia r se mide desde el centro. En todos los gráficos, la línea vertical punteada marca la superficie, es decir, r igual a R. El eje horizontal representa r dividido por R. Para que podamos comparar las curvas sin elegir valores particulares de carga y radio, representamos el campo dividido por k Q sobre R al cuadrado, y el potencial dividido por k Q sobre R. Por eso las curvas llegan al valor uno en la superficie exterior, cuando corresponde.\n\nPrimer caso: esfera maciza aislante con carga distribuida uniformemente en todo el volumen. Pensemos en una esfera plástica ideal que contiene carga positiva distribuida homogéneamente. Si aplicamos la ley de Gauss a una superficie esférica interior, la carga encerrada aumenta con el cubo de r. Como el área aumenta con el cuadrado de r, el campo resultante dentro de la esfera aumenta proporcionalmente a r. Por eso la curva verde del campo arranca en cero en el centro y crece en línea recta hasta su valor en la superficie. Más allá de R, el campo disminuye como uno sobre r al cuadrado, porque desde afuera la distribución actúa como una carga puntual equivalente.\n\nAnalicemos ahora el potencial de esa misma esfera. Es una magnitud escalar relacionada con la energía potencial por unidad de carga. En el centro tiene su valor máximo para Q positiva y, al alejarnos, disminuye suavemente de manera cuadrática hasta la superficie. Luego cae como uno sobre r. Observemos algo crucial: el potencial es continuo y su pendiente está relacionada con el campo mediante la expresión campo radial igual menos derivada del potencial respecto de r. Allí donde el campo aumenta, la pendiente del potencial se vuelve más negativa.\n\nSegundo caso: cáscara esférica aislante muy delgada con carga distribuida uniformemente sobre su superficie. Toda la carga está a la distancia R del centro. Para cualquier superficie gaussiana interior, la carga neta encerrada es cero; por simetría, el campo dentro de la cáscara también es cero. Por eso la gráfica naranja del campo coincide con el eje horizontal hasta R. Al pasar la superficie aparece un salto en el valor del campo idealizado. En el gráfico lo distinguimos con círculos abiertos y cerrados, sin dibujar una unión inclinada que daría una impresión equivocada. Fuera de la cáscara el campo vuelve a disminuir con uno sobre r al cuadrado.\n\n¿Y el potencial? Aunque el campo interior sea cero, el potencial no tiene por qué ser cero. En toda la región interior tiene exactamente el mismo valor que en la superficie: k Q dividido por R. Por eso la curva del potencial es horizontal hasta R y luego decrece suavemente. La ausencia de campo significa que el potencial no cambia de un punto interior a otro, no que su valor absoluto sea nulo.\n\nTercer caso: esfera metálica maciza conductora, aislada y en equilibrio electrostático. Los portadores móviles se redistribuyen hasta anular el campo dentro del material. La carga excedente queda sobre la superficie exterior. Por tanto, su campo y su potencial tienen exactamente la misma forma que en la cáscara esférica uniforme anterior, bajo las hipótesis indicadas. La diferencia es el mecanismo físico: en el conductor la redistribución resulta del movimiento de cargas hacia el equilibrio; en la cáscara aislante uniforme la distribución superficial se establece como condición inicial del modelo. Estas conclusiones también valen para una esfera conductora hueca con cavidad vacía y sin cargas en su interior.\n\nPara cerrar, comparemos tres ideas. Primero, el campo y el potencial son magnitudes distintas: uno es vectorial y el otro escalar. Segundo, el potencial permanece continuo en la superficie de estos modelos, aun cuando el campo puede tener un salto. Tercero, campo igual a cero no significa potencial igual a cero. Usen los gráficos para contestar: ¿cuál es el campo en el centro de cada objeto?, ¿en cuál cambia el potencial en el interior?, ¿por qué los tres sistemas dan el mismo resultado exterior?", "kind": "concept", "sim": null}, {"title": "Potencial eléctrico y diferencia de potencial", "kicker": "ENERGÍA", "body": "<div class=\"formula\">V = U / q</div><div class=\"formula\">ΔV = ΔU / q</div><ul><li>El potencial es energía potencial eléctrica por unidad de carga.</li><li>La diferencia de potencial entre dos puntos permite calcular el trabajo por unidad de carga.</li><li>Las líneas de campo son perpendiculares a las superficies equipotenciales.</li></ul><iframe class=\"widegraph\" title=\"Equipotenciales y campo eléctrico\" src=\"assets/lineas_equipotenciales.html\"></iframe>", "script": "El potencial eléctrico ofrece una mirada energética del problema. Mientras el campo nos dice qué fuerza aparece sobre una carga de prueba positiva, el potencial nos informa cuánta energía potencial eléctrica corresponde a cada unidad de carga. Por eso es una magnitud escalar. Más importante que el valor absoluto del potencial suele ser la diferencia de potencial entre dos puntos, porque esa diferencia determina el trabajo por unidad de carga asociado al desplazamiento. Las superficies equipotenciales unen puntos con igual potencial, de modo que mover una carga a lo largo de una de ellas no modifica su energía potencial. El campo eléctrico es perpendicular a las equipotenciales y apunta, en el sentido convencional, desde regiones de mayor potencial hacia regiones de menor potencial.", "kind": "concept", "sim": null}, {"title": "Conductores en equilibrio y efecto de punta", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"stackblock\"><img class=\"slideimg\" src=\"assets/conductores_equilibrio_punta.png\" alt=\"Infografía sobre conductores en equilibrio electrostático y efecto de punta\"><p class=\"imgcaption\">La imagen resume dos ideas centrales: en equilibrio electrostático la carga libre queda en la superficie y el campo interior es nulo; en regiones agudas, las cargas se concentran más y el campo exterior aumenta.</p><ul><li>En equilibrio electrostático, el campo en el material conductor es nulo.</li><li>Todo el conductor queda al mismo potencial: es <b>equipotencial</b>.</li><li>La carga libre se acumula en la superficie y se concentra más en regiones de gran curvatura.</li><li>Ese aumento local del campo explica el <b>efecto de punta</b>, el efecto corona y el fundamento del blindaje electrostático.</li></ul></div>", "script": "En esta filmina incorporamos una imagen representativa para visualizar dos ideas que suelen resultar abstractas cuando sólo se enuncian con palabras. La primera aparece en el panel de la izquierda. Allí se muestra un conductor en equilibrio electrostático. En ese estado, las cargas libres ya se redistribuyeron completamente y por eso el campo eléctrico en el interior del material conductor es nulo. Si existiera un campo interno, las cargas continuarían moviéndose, de modo que el equilibrio no se habría alcanzado. Por esa razón, toda la masa conductora queda al mismo potencial: el conductor es equipotencial. Además, la carga neta excedente se ubica sobre la superficie y las líneas de campo emergen o llegan perpendicularmente a ella. La segunda idea se muestra en el panel de la derecha y corresponde al efecto de punta. Allí observamos un conductor terminado en una punta aguda. Como la curvatura es mayor en esa región, la densidad superficial de carga también puede ser mayor y, en consecuencia, el campo eléctrico exterior se intensifica cerca de la punta. Esa mayor intensidad local ayuda a comprender fenómenos como el efecto corona, las descargas preferenciales en zonas agudas y el funcionamiento conceptual del pararrayos. Pedagógicamente, la imagen permite comparar un caso de distribución relativamente uniforme en una superficie suave con otro caso en el que la geometría modifica fuertemente la distribución de carga y la intensidad del campo. Conviene remarcar que el efecto de punta no contradice la condición de equilibrio: el conductor sigue siendo equipotencial, pero la densidad de carga y el campo exterior no tienen por qué ser iguales en todos los puntos de la superficie.", "kind": "concept", "sim": null}, {"title": "Corriente, resistencia y ley de Ohm", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">I = ΔQ / Δt</div><div class=\"formula\">V = R I</div><ul><li>Corriente convencional: sentido de transporte de carga positiva.</li><li>En metales, los electrones se desplazan en sentido opuesto.</li><li>La ley de Ohm describe una relación lineal bajo condiciones apropiadas.</li></ul>", "script": "La corriente eléctrica mide la carga que atraviesa una sección por unidad de tiempo. Por convenio, su sentido coincide con el movimiento de cargas positivas; en un metal, los electrones se desplazan en sentido contrario. La resistencia expresa la oposición al paso de corriente y depende tanto del material como de la geometría del conductor. La ley de Ohm, escrita como tensión igual resistencia por corriente, no es una verdad universal para todo dispositivo en cualquier condición; describe el comportamiento lineal de elementos óhmicos bajo condiciones apropiadas. Entender esta idea evita transformar la ecuación en una receta vacía. Debemos preguntarnos siempre qué elemento estamos modelando, si su comportamiento es aproximadamente lineal y qué interpretación física tiene la tensión aplicada.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Ohm", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Resistencia, tensión, corriente y gráfico de Ohm</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Resistencia, tensión, corriente y gráfico de Ohm\" data-sim=\"s8\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "Usen la simulación para relacionar tres registros de una misma situación física: la ecuación, la tabla de valores y la gráfica tensión-corriente. Para una resistencia fija, verifiquen que al aumentar la tensión aumenta proporcionalmente la corriente. Luego mantengan constante la tensión y modifiquen la resistencia para observar cómo cambia la corriente. Presten atención a la recta V contra I: su pendiente representa la resistencia del elemento. Si el comportamiento es lineal, estamos frente a un modelo óhmico. El objetivo no es sólo calcular un valor, sino interpretar qué significa la pendiente, qué magnitud queda representada en cada eje y cómo se reconoce experimentalmente una relación proporcional.", "kind": "lab", "sim": "s8"}, {"title": "Potencia y energía eléctrica", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">P = V I = I²R = V²/R</div><div class=\"formula\">W = P t</div><p>La energía eléctrica consumida puede expresarse en joules o kilowatt-hora.</p>", "script": "La potencia eléctrica describe la rapidez con la que un sistema transforma o transfiere energía eléctrica. En un resistor calefactor, por ejemplo, gran parte de esa energía se transforma en energía térmica. Las distintas expresiones de la potencia no son fórmulas independientes: surgen de combinar definición de potencia con ley de Ohm. La energía consumida durante un intervalo se obtiene multiplicando potencia por tiempo, y puede expresarse en joules o en kilowatt-hora. Esta distinción es importante porque en la práctica industrial solemos estimar consumos, costos y cargas térmicas a partir de energía acumulada, no solo de potencia instantánea. Por eso conviene diferenciar claramente qué magnitud estamos calculando en cada momento.", "kind": "concept", "sim": null}, {"title": "Laboratorio: potencia y energía", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Consumo eléctrico y calentamiento resistivo</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Consumo eléctrico y calentamiento resistivo\" data-sim=\"s9\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En la simulación comparen dos niveles de análisis. Primero, el instantáneo: observen cómo cambian corriente y potencia cuando modifican tensión o resistencia. Segundo, el acumulativo: sigan la energía consumida a lo largo del tiempo. Un mismo equipo puede tener una potencia moderada pero, si funciona durante mucho tiempo, acumular una energía significativa. Relacionen esos resultados con situaciones concretas de proceso, como el uso de resistencias calefactoras. El gráfico de energía permite ver que la pendiente está asociada a la potencia: cuanto mayor es la potencia, más rápidamente crece la energía acumulada.", "kind": "lab", "sim": "s9"}, {"title": "Circuitos: serie, paralelo y mixtos", "kicker": "CIRCUITOS", "body": "<ul><li>En serie, la misma corriente atraviesa cada elemento.</li><li>En paralelo, las ramas comparten diferencia de potencial.</li><li>Los circuitos mixtos combinan ambas configuraciones.</li></ul>", "script": "Para analizar circuitos no alcanza con reconocer símbolos; es necesario identificar cómo están conectados los elementos. En una conexión en serie, la misma corriente atraviesa todos los componentes porque no hay ramificaciones entre ellos. En una conexión en paralelo, los elementos comparten los mismos nodos extremos, de modo que tienen la misma diferencia de potencial. Los circuitos mixtos combinan ambas configuraciones y requieren simplificar por etapas, respetando la topología real del circuito. Estas ideas son fundamentales porque la distribución de tensiones y corrientes depende de la forma de conexión, no solo de los valores de las resistencias. Antes de calcular, siempre conviene preguntarse: ¿qué magnitudes son comunes y cuáles se reparten?", "kind": "concept", "sim": null}, {"title": "Laboratorio: circuitos resistivos", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Asociación de resistores en serie, paralelo y mixto</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Asociación de resistores en serie, paralelo y mixto\" data-sim=\"s10\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En este laboratorio trabajen paso a paso. Identifiquen primero qué resistencias están claramente en serie y cuáles están en paralelo. Luego calculen o estimen la resistencia equivalente y recién después miren los resultados del simulador. Observen cómo se distribuyen corriente y tensión según la configuración. En serie, la corriente es la misma y las tensiones parciales se suman. En paralelo, la tensión de rama es la misma y las corrientes se reparten. El objetivo es que la equivalencia no se vea como un truco algebraico, sino como una herramienta para describir cómo responde el circuito completo frente a una fuente dada.", "kind": "lab", "sim": "s10"}, {"title": "Leyes de Kirchhoff", "kicker": "CIRCUITOS", "body": "<div class=\"formula\">Nodo: Σ I = 0</div><div class=\"formula\">Malla: Σ ΔV = 0</div><ul><li>Ley de nodos: conservación de la carga.</li><li>Ley de mallas: balance de energía en un recorrido cerrado.</li><li>Las corrientes elegidas pueden resultar negativas: indican sentido contrario.</li></ul>", "script": "Las leyes de Kirchhoff extienden el análisis de circuitos a casos donde la simple reducción serie-paralelo no alcanza. La ley de nodos expresa conservación de la carga: en un nodo, la suma algebraica de corrientes es cero porque la carga no se acumula indefinidamente en ese punto. La ley de mallas expresa conservación de la energía: al recorrer una trayectoria cerrada, la suma algebraica de subidas y caídas de potencial es cero. Para usarlas correctamente debemos fijar sentidos de referencia para corrientes y polaridades. Si al resolver aparece un valor negativo, no significa error: indica que el sentido real es opuesto al elegido como referencia.", "kind": "concept", "sim": null}, {"title": "Laboratorio: Kirchhoff", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Dos mallas resistivas con rama compartida</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Dos mallas resistivas con rama compartida\" data-sim=\"s11\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "Usen esta simulación para vincular ecuaciones y significado físico. Elijan sentidos de corriente de referencia y escriban las ecuaciones de malla y de nodo antes de consultar la solución. Luego modifiquen fuentes y resistencias para ver cómo cambian los resultados. Presten atención a la rama compartida: allí pueden comparar el valor obtenido por la resolución algebraica con el balance de corrientes. Si una corriente resulta negativa, interprétenla correctamente: el circuito no falla, simplemente la corriente real circula en sentido contrario al asumido al plantear el problema.", "kind": "lab", "sim": "s11"}, {"title": "Magnetismo y fuerzas magnéticas", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">𝐅 = q(𝐯 × 𝐁)</div><ul><li>Las corrientes eléctricas generan campo magnético.</li><li>Sobre una carga en movimiento puede actuar una fuerza perpendicular a la velocidad y al campo.</li><li>Bobinas y conductores permiten construir electroimanes y motores.</li></ul>", "script": "El magnetismo completa el cuadro electromagnético. Un campo magnético puede originarse en un imán permanente o en cargas en movimiento, es decir, corrientes eléctricas. La fuerza magnética sobre una carga móvil es perpendicular tanto a la velocidad como al campo, de modo que tiende a desviar la trayectoria más que a cambiar directamente la rapidez. Esta característica distingue al magnetismo del caso eléctrico simple. En conductores recorridos por corriente, la interacción entre corriente y campo magnético está en la base de motores, relés y numerosos actuadores. Al estudiar estas fuerzas conviene recordar que la orientación depende de una regla vectorial, usualmente expresada mediante el producto vectorial y la regla de la mano derecha.", "kind": "concept", "sim": null}, {"title": "Inducción electromagnética", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">ℰ = −N ΔΦ<sub>B</sub> / Δt</div><ul><li>Una variación de flujo magnético produce fuerza electromotriz inducida.</li><li>La ley de Lenz establece el sentido de oposición al cambio del flujo.</li><li>Fundamento de generadores, transformadores y numerosos sensores.</li></ul>", "script": "La inducción electromagnética aparece cuando cambia el flujo magnético enlazado con un circuito. No alcanza con tener campo magnético: debe haber una variación de flujo, ya sea por cambio del campo, del área, de la orientación o del movimiento relativo entre imán y circuito. La ley de Faraday relaciona la fuerza electromotriz inducida con la rapidez de ese cambio. El signo negativo expresa la ley de Lenz: la corriente inducida genera efectos que se oponen a la variación que la produce. Esta idea es esencial porque introduce una realimentación física. Generadores, transformadores, cocinas de inducción y múltiples sensores aprovechan, de una u otra forma, este mismo principio.", "kind": "concept", "sim": null}, {"title": "Laboratorio: inducción", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Variación de flujo y fuerza electromotriz inducida</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Variación de flujo y fuerza electromotriz inducida\" data-sim=\"s14\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En la simulación analicen qué sucede al modificar frecuencia, número de espiras, área efectiva o intensidad del campo. Todos esos cambios alteran el flujo magnético o su ritmo de variación y, por lo tanto, modifican la fuerza electromotriz inducida. Miren la señal obtenida e intenten relacionar su amplitud con la ley de Faraday. No pierdan de vista el sentido físico: la señal aparece porque el sistema responde al cambio del flujo. Si el flujo fuese estrictamente constante, no habría inducción. También conviene discutir el papel del signo y su vínculo con la ley de Lenz.", "kind": "lab", "sim": "s14"}, {"title": "Instrumentación y sensores", "kicker": "TECNOLOGÍA DE ALIMENTOS", "body": "<ul><li>La cadena de medición transforma una variable física en una señal interpretable.</li><li>Pt100 y termocuplas permiten medir temperatura con principios diferentes.</li><li>Las señales de 4–20 mA se utilizan en instrumentación industrial.</li><li>El controlador interpreta la señal y puede actuar sobre calefacción, refrigeración o motores.</li></ul>", "script": "En tecnología de alimentos no estudiamos electricidad sólo por interés teórico: la necesitamos para medir, controlar y actuar sobre procesos. Toda cadena de instrumentación comienza con una variable física, como temperatura, nivel o presión. Un sensor transforma esa variable en una respuesta eléctrica; luego un transmisor o acondicionador adapta la señal para que pueda ser transportada e interpretada. Las Pt100 basan su funcionamiento en la variación de resistencia con la temperatura, mientras que las termocuplas producen una diferencia de potencial termoeléctrica. Las señales de 4 a 20 miliamperes son frecuentes porque son robustas frente a perturbaciones y permiten detectar fallas de lazo. Finalmente, un controlador interpreta la señal y puede gobernar actuadores como resistencias, válvulas o motores.", "kind": "concept", "sim": null}, {"title": "Caso integrador: tanque con calentamiento", "kicker": "APLICACIÓN INDUSTRIAL", "body": "<div class=\"labdesc\">Medición de temperatura y consumo eléctrico del calefactor</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Medición de temperatura y consumo eléctrico del calefactor\" data-sim=\"s16\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "Este caso integrador reúne medición y actuación. El tanque posee una variable de proceso, la temperatura, que debe ser medida mediante un sensor y luego interpretada por un sistema de control. Al mismo tiempo, una resistencia calefactora transforma energía eléctrica en calor para modificar el estado del sistema. Observen cómo convergen aquí varios conceptos de la unidad: diferencia de potencial, corriente, resistencia, potencia, energía e instrumentación. No es un ejemplo artificial: en procesos alimentarios, muchas operaciones dependen precisamente de medir bien y suministrar energía de manera controlada. La actividad invita a mirar el sistema completo y no sólo cada ecuación por separado.", "kind": "lab", "sim": "s16"}, {"title": "Síntesis y preguntas para el cierre", "kicker": "CIERRE", "body": "<ul><li>¿Qué diferencia hay entre campo eléctrico y fuerza eléctrica?</li><li>¿Por qué en una esfera conductora la carga neta se ubica en su superficie exterior?</li><li>¿Puede haber potencial distinto de cero cuando el campo es nulo?</li><li>¿Qué evidencia aporta el electroscopio?</li><li>¿Cómo se aplican Kirchhoff y la ley de Ohm en una instalación de proceso?</li></ul>", "script": "Para cerrar la unidad conviene reconstruir el hilo conductor. Comenzamos con la carga eléctrica y las formas de electrización. Luego introdujimos campo y potencial para describir la interacción eléctrica tanto en lenguaje vectorial como energético. La ley de Gauss y las distribuciones esféricas nos permitieron aprovechar la simetría para interpretar campo y potencial en objetos concretos. Más tarde pasamos a corriente, resistencia, potencia y circuitos, y formalizamos su análisis con la ley de Ohm y las leyes de Kirchhoff. Finalmente incorporamos magnetismo, inducción e instrumentación. Las preguntas de esta última filmina no buscan un dato aislado: apuntan a verificar si logramos conectar las distintas representaciones de un mismo fenómeno físico.", "kind": "concept", "sim": null}];

function saveStore(){try{localStorage.setItem('u7presentation_scripts_v08',JSON.stringify(overrides))}catch(e){}}
function stopSpeech(){speechToken++;voiceQueue=[];if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function render(i){const playing=$('content').querySelector('video');if(playing)playing.pause();stopSpeech();current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];$('sheet').className='sheet '+s.kind;$('kicker').textContent=s.kicker;$('heading').textContent=s.title;$('content').innerHTML=s.body;$('counter').textContent=(current+1)+' / '+slides.length;$('goto').value=String(current);$('prev').disabled=$('prev2').disabled=current===0;$('next').disabled=$('next2').disabled=current===slides.length-1;$('scriptbox').classList.toggle('visible',scriptOpen);$('scriptarea').value=getScript(current);document.title='Unidad 7 · '+s.title;location.hash='f'+(current+1);window.scrollTo(0,0);
// Load heavy simulations only when opened, avoiding dozens of WebGL contexts.
const sim=$('content').querySelector('iframe[data-sim]');if(sim){sim.src='assets/apunte_simulaciones.html?embed='+encodeURIComponent(sim.dataset.sim)+'#'+sim.dataset.sim}
const st=$('content').querySelector('iframe[data-static]');if(st){st.src=st.dataset.static}
}
function splitNarration(raw){return raw.match(/[^.!?\n]+(?:[.!?]+|\n|$)/g)?.map(s=>s.trim()).filter(Boolean)||[raw]}
function read(){stopSpeech();if(!('speechSynthesis' in window)){$('speechstatus').textContent='Síntesis de voz no disponible en este navegador';return;}const token=++speechToken;voiceQueue=splitNarration(getScript(current));let j=0;function next(){if(token!==speechToken)return;if(j>=voiceQueue.length){$('speechstatus').textContent='Lectura terminada.';return}const u=new SpeechSynthesisUtterance(voiceQueue[j++]);u.lang='es-AR';u.rate=+$('rate').value;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='es-AR')||voices.find(v=>v.lang?.startsWith('es'))||null;u.onend=next;u.onerror=e=>{$('speechstatus').textContent='La voz reportó un error: '+e.error;};$('speechstatus').textContent='Narrando filmina '+(current+1)+' · fragmento '+j+'/'+voiceQueue.length;window.speechSynthesis.speak(u)}next()}
for(const [id,step] of [['prev',-1],['prev2',-1],['next',1],['next2',1]])$(id).onclick=()=>render(current+step);
$('goto').onchange=e=>render(+e.target.value);$('speak').onclick=read;$('pause').onclick=()=>window.speechSynthesis?.pause();$('resume').onclick=()=>window.speechSynthesis?.resume();$('stop').onclick=stopSpeech;
$('toggleScript').onclick=()=>{scriptOpen=!scriptOpen;$('scriptbox').classList.toggle('visible',scriptOpen);if(scriptOpen)$('scriptarea').value=getScript(current)};
$('saveScript').onclick=()=>{overrides[current]=$('scriptarea').value;saveStore();$('speechstatus').textContent='Guion personalizado guardado en la versión 0.8.'};$('resetScript').onclick=()=>{delete overrides[current];saveStore();$('scriptarea').value=getScript(current);$('speechstatus').textContent='Restablecido el guion predeterminado de la versión 0.8.'};
$('exportScripts').onclick=()=>{const result=slides.map((s,i)=>({filmina:i+1,titulo:s.title,guion:getScript(i)}));let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='guiones_presentacion_unidad7.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importScripts').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('No es una lista');for(const item of data){const i=Number(item.filmina)-1;if(i>=0&&i<slides.length&&typeof item.guion==='string')overrides[i]=item.guion}saveStore();$('scriptarea').value=getScript(current);$('speechstatus').textContent='Guiones importados.'}catch(err){alert('Archivo inválido: '+err.message)}e.target.value=''};
slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;$('goto').appendChild(o)});const n=Number((location.hash||'').replace('#f',''))-1;render(Number.isInteger(n)&&n>=0?n:0);
window.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}});
</script></body></html>
