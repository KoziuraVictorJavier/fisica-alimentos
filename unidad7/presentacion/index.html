</style></head><body><div class="app"><button id="readerToggle" class="reader-float" type="button" aria-controls="readerPanel" aria-expanded="false" title="Mostrar u ocultar lector">🔊 <span>Lector</span></button><header class="bar"><span class="brand">UTN · FÍSICA APLICADA · UNIDAD 7</span><select id="goto" aria-label="Ir a filmina"></select><button id="prev">← Anterior</button><button id="next">Siguiente →</button><div class="reader-panel reader-collapsed" id="readerPanel" role="region" aria-label="Lector de filminas"><button id="speak">▶ Leer</button><button id="pause">⏸</button><button id="resume">⏵</button><button id="stop">■</button><button id="toggleScript">Editar guion</button><label class="reader-cont-label"><input type="checkbox" id="continuousReading"> ▶ Lectura continua</label><label>Voz <input id="rate" type="range" min="0.7" max="1.4" step="0.1" value="1"></label><div class="speechstatus" id="speechstatus">Presentación v0.4: guiones ampliados activos. Los textos guardados en versiones anteriores se conservan por separado. Las expresiones matemáticas se leen mediante el guion.</div></div></header><div class="body"><article class="sheet" id="sheet"><div class="eyebrow" id="kicker"></div><h1 id="heading"></h1><div class="content" id="content"></div><div class="scriptbox" id="scriptbox"><label for="scriptarea"><b>Guion ampliado v0.4 de la filmina — editable</b></label><textarea id="scriptarea" class="scriptarea"></textarea><div class="script-buttons"><button id="saveScript">Guardar</button><button id="resetScript">Restablecer</button><button id="exportScripts">Exportar JSON</button><button id="importScripts">Importar JSON</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div></article><nav class="bottom"><button id="prev2">← Anterior</button><span class="counter" id="counter"></span><button id="next2">Siguiente →</button></nav></div></div><script>
const slides=[{"title": "Electricidad aplicada", "kicker": "UNIDAD 7 · TECNICATURA EN ALIMENTOS", "body": "<p class=\"lead\">De la carga eléctrica a los campos, los circuitos y la instrumentación de los procesos alimentarios.</p><ul><li>Conceptos explicados desde fenómenos observables</li><li>Simbología eléctrica, ecuaciones y aplicaciones industriales</li><li>Simuladores interactivos y actividades de interpretación</li></ul>", "script": "Presentamos la unidad siete, Electricidad aplicada. Partiremos de la electrización y la noción de campo. Luego relacionaremos fuerza, campo y potencial, estudiaremos materiales y circuitos, y terminaremos con electromagnetismo e instrumentación. Cada simulación permite modificar parámetros y observar las consecuencias físicas.", "kind": "cover", "sim": null}, {"title": "Objetivos y recorrido", "kicker": "ORIENTACIÓN", "body": "<ul><li>Distinguir carga, fuerza, campo y potencial eléctrico.</li><li>Interpretar conductores, aislantes y distribución de carga en geometrías esféricas.</li><li>Explicar la electrización, la inducción y el funcionamiento del electroscopio.</li><li>Aplicar la ley de Ohm y las leyes de Kirchhoff.</li><li>Reconocer los principios de sensores y actuadores eléctricos.</li></ul>", "script": "En esta presentación retomamos la secuencia conceptual completa de la unidad. Primero estudiaremos cómo se electrizan los cuerpos y qué significa hablar de carga eléctrica. Después introduciremos la noción de campo, que permite describir la acción de una carga sobre el espacio sin necesidad de imaginar un contacto directo. A continuación relacionaremos fuerza, campo y potencial, y analizaremos cómo cambian estas magnitudes en geometrías simples, sobre todo en distribuciones esféricas. En el segundo bloque pasaremos a corriente, ley de Ohm, potencia, circuitos y leyes de Kirchhoff. Finalmente cerraremos con magnetismo, inducción e instrumentación, conectando todo con aplicaciones en tecnología de alimentos. La intención no es recitar fórmulas, sino comprender qué magnitudes intervienen, qué hipótesis estamos usando y qué significado físico tiene cada resultado.", "kind": "concept", "sim": null}, {"title": "Historia de la electricidad y el magnetismo", "kicker": "MARCO HISTÓRICO", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/historia_electricidad_magnetismo.png\" alt=\"Infografía: historia de la electricidad y el magnetismo\"><p class=\"imgnote\">La línea de tiempo resume hitos desde las observaciones antiguas del ámbar y la magnetita hasta la síntesis del electromagnetismo y su verificación experimental.</p></div>", "script": "Esta infografía explica cómo el conocimiento eléctrico y magnético pasó de observaciones cotidianas a una teoría física capaz de predecir fenómenos. No se trató de un descubrimiento aislado, sino de una construcción colectiva apoyada en instrumentos, experimentos y leyes matemáticas.\nComenzamos en la Antigüedad. El ámbar frotado podía atraer pequeños objetos y la magnetita atraía hierro. Son dos fenómenos distintos: uno está relacionado con la electrización y el otro con las propiedades magnéticas de ciertos materiales. En ese momento todavía no existía una teoría que los relacionara.\nEn 1600, William Gilbert publicó De Magnete. Realizó un estudio sistemático de los imanes y describió la Tierra como un gran imán. La importancia de su trabajo fue reemplazar parte de las explicaciones especulativas por observaciones y ensayos reproducibles.\nEn 1785, Charles-Augustin de Coulomb cuantificó la interacción entre cargas utilizando una balanza de torsión. Encontró que, en el modelo de cargas puntuales, la magnitud de la fuerza disminuye con el cuadrado de la distancia. Esta ley permitió calcular fuerzas en lugar de limitarse a describir atracciones o repulsiones.\nEn 1800, Alessandro Volta desarrolló la pila voltaica. Hasta entonces, buena parte de los experimentos trabajaba con descargas breves de electricidad estática. La pila hizo posible sostener corrientes durante un tiempo suficiente para estudiar los circuitos.\nEn 1820, Hans Christian Ørsted observó que una corriente eléctrica desvía la aguja de una brújula. Esto reveló una relación directa entre electricidad y magnetismo. André-Marie Ampère investigó luego las fuerzas entre corrientes y contribuyó a formular cuantitativamente esa relación.\nEn 1827, Georg Ohm publicó la relación entre tensión, corriente y resistencia para ciertos conductores bajo condiciones definidas. Aunque en el póster su figura aparezca después de Faraday, cronológicamente el trabajo de Ohm es anterior al descubrimiento de la inducción de 1831.\nEn 1831, Michael Faraday mostró que un flujo magnético variable puede originar una fuerza electromotriz inducida. La pregunta clave pasó a ser no solo qué campo existe, sino cómo cambia y qué efectos produce su variación. Allí se encuentra el fundamento de los generadores y transformadores.\nEn 1845, Gustav Kirchhoff formuló las leyes que hoy utilizamos para estudiar la conservación de carga y los balances de tensión en circuitos concentrados. Entre 1861 y 1865, James Clerk Maxwell reunió los resultados experimentales y teóricos en una descripción unificada del campo electromagnético. Su teoría predijo la existencia de ondas electromagnéticas que se propagan por el espacio.\nEn 1887 y 1888, Heinrich Hertz generó y detectó esas ondas experimentalmente, aportando una comprobación decisiva de las predicciones de Maxwell.\nComo conclusión, observamos una secuencia científica: primero se identifica un fenómeno, luego se mide, se formula una ley y finalmente se integra en una teoría más general. En esta unidad seguiremos ese recorrido, desde la carga y el campo hasta la corriente, los circuitos, el magnetismo y la inducción.", "kind": "infographic", "sim": null}, {"title": "Un concepto que reúne muchos fenómenos: campo", "kicker": "CAMPO FÍSICO", "body": "<p class=\"lead\">Un campo asigna un valor físico a cada punto de una región del espacio.</p><ul><li><b>Escalar:</b> temperatura, presión, potencial eléctrico.</li><li><b>Vectorial:</b> campo gravitatorio, eléctrico o magnético.</li><li>Las flechas representan dirección, sentido e intensidad; las líneas de campo son una representación geométrica.</li></ul>", "script": "La idea de campo aparece cuando queremos describir cómo una fuente modifica las condiciones físicas del espacio que la rodea. Un campo asigna un valor a cada punto: si el valor es solamente numérico, hablamos de un campo escalar, como la temperatura o el potencial eléctrico. Si en cada punto debemos indicar además dirección y sentido, hablamos de un campo vectorial, como el campo gravitatorio, eléctrico o magnético. Esta forma de describir el fenómeno es poderosa porque separa dos cuestiones: por un lado, la fuente que genera el campo; por otro, el cuerpo de prueba que responde cuando lo ubicamos en ese lugar. En vez de pensar la interacción a distancia como algo misterioso, pensamos que la fuente establece una cierta estructura espacial, y que cada partícula responde localmente a esa estructura.", "kind": "concept", "sim": null}, {"title": "Infografía: campo escalar y vectorial", "kicker": "CAMPO · APOYO VISUAL", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/concepto_campo.png\" alt=\"Infografía: concepto de campo\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/campo_concepto.html\" style=\"height:300px\"></iframe><p class=\"imgnote\">La infografía integra campo escalar, campo vectorial, modos de representación y la idea de superposición.</p></div>", "script": "Esta infografía tiene la función de fijar una idea previa que luego se utilizará en todo el resto de la unidad: un campo es una magnitud definida en cada punto del espacio. La lámina compara el caso de un campo escalar, donde en cada punto basta un valor numérico, con el de un campo vectorial, donde además debemos indicar dirección y sentido. El ejemplo de temperatura ayuda a entender el campo escalar; el ejemplo de los campos gravitatorio y eléctrico ayuda a entender el caso vectorial. También se introduce la noción de superposición: si varias fuentes actúan al mismo tiempo, el campo total en un punto surge de combinar las contribuciones individuales. La importancia de esta imagen es metodológica. Permite que el estudiante no vea al campo eléctrico como un concepto aislado, sino como parte de una familia de descripciones físicas que comparten una misma lógica: una fuente modifica el espacio que la rodea y un cuerpo de prueba responde según el valor del campo en su posición.", "kind": "infographic", "sim": null}, {"title": "Campo gravitatorio como referencia", "kicker": "CAMPO FÍSICO", "body": "<div class=\"formula\">𝐅<sub>g</sub> = m 𝐠</div><div class=\"formula\">𝐠 ≈ (0; −9,81; 0) N/kg</div><p>Se adopta eje vertical positivo hacia arriba y una región pequeña próxima a la superficie terrestre.</p>", "script": "Conviene comenzar con un ejemplo conocido. Cerca de la superficie terrestre, la Tierra genera un campo gravitatorio aproximadamente uniforme. Si colocamos una masa en esa región, la fuerza que experimenta es el peso, y vale masa por campo gravitatorio. Ese ejemplo nos sirve para distinguir con claridad campo y fuerza. El campo gravitatorio es una propiedad de la región del espacio generada por la Tierra; la fuerza aparece cuando ubicamos una masa en ese campo. Además, el ejemplo muestra una idea que luego reaparece en electrostática: una misma estructura conceptual permite describir situaciones diferentes. Más adelante, al escribir fuerza eléctrica igual carga por campo eléctrico, recuperaremos una analogía directa con esta expresión gravitatoria.", "kind": "concept", "sim": null}, {"title": "Video experimental: 10 experimentos de electrostática", "kicker": "OBSERVACIÓN EXPERIMENTAL · ELECTROSTÁTICA", "kind": "video", "sim": null, "body": "<p class=\"lead\">Antes de formalizar el concepto de carga eléctrica, observemos algunos fenómenos de electrostática.</p><video class=\"experimentvideo\" controls playsinline preload=\"metadata\" aria-label=\"Video: 10 experimentos de electrostática\"><source src=\"assets/10_Experimentos_de_Electrostatica.mp4\" type=\"video/mp4\">Este navegador no admite reproducción de video HTML5.</video><p class=\"videosource\"><strong>Origen del video:</strong> <a href=\"https://www.youtube.com/watch?v=rZN8EOp0nFU\" target=\"_blank\" rel=\"noopener noreferrer\">10 Experimentos de Electrostática — publicación original en YouTube</a>. Archivo MP4 proporcionado para su uso en esta presentación.</p><div class=\"note\"><strong>Preguntas para observar:</strong> ¿Qué cuerpos se atraen o repelen? ¿Hay contacto? ¿Qué papel cumplen el material y la humedad? ¿Cómo distinguir carga neta de polarización?</div>", "script": "Antes de estudiar formalmente la carga eléctrica, observaremos un conjunto de demostraciones experimentales tomadas del video titulado Diez experimentos de electrostática. La fuente de origen está identificada debajo del reproductor mediante el enlace a YouTube. Durante la reproducción no se pretende identificar de antemano el resultado de cada ensayo; se trata de observar y describir. Preguntemos qué materiales intervienen, si los cuerpos se tocan, si hay atracción o repulsión, y qué sucede cuando cambia la distancia. También conviene distinguir lo que efectivamente vemos de la explicación física que propondremos después. Un objeto neutro puede experimentar atracción por polarización, por lo que una atracción observada no demuestra por sí sola que ambos cuerpos estén cargados con signos opuestos. Después del video relacionaremos estas observaciones con la estructura de la materia, la transferencia de electrones, la conservación de la carga, la electrización por frotamiento, contacto e inducción, y la diferencia entre conductores y aislantes. El video constituye una introducción experimental, no reemplaza la fundamentación teórica."}, {"title": "Carga eléctrica: qué es y cómo se conserva", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">q = n e</div><ul><li>Existen cargas positivas y negativas.</li><li>La electrización modifica el balance de cargas; no crea carga neta.</li><li>En sólidos, la transferencia suele involucrar electrones.</li></ul>", "script": "La carga eléctrica es una propiedad de la materia responsable de las interacciones electromagnéticas. En la materia ordinaria encontramos protones con carga positiva y electrones con carga negativa. Un cuerpo neutro contiene ambas en igual cantidad, aunque eso no significa que no pueda electrizarse. Cuando un cuerpo gana electrones queda con carga neta negativa; cuando pierde electrones, con carga neta positiva. Un punto fundamental es la conservación de la carga: en un sistema aislado no se crea ni se destruye carga neta, sino que se redistribuye. En muchos procesos de electrización de sólidos lo que realmente se transfiere son electrones. La expresión q igual n por e recuerda, además, que la carga está cuantizada: aparece como múltiplo entero de la carga elemental.", "kind": "concept", "sim": null}, {"title": "Formas de electrización", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/carga_electrica_electrizacion.png\" alt=\"Infografía: carga eléctrica y formas de electrización\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/cargas_transferencia.html\" style=\"height:250px\"></iframe><ul><li><b>Frotamiento:</b> transferencia de electrones entre materiales.</li><li><b>Contacto:</b> redistribución de carga al tocar un conductor cargado con otro cuerpo.</li><li><b>Inducción:</b> redistribución sin contacto; para una carga neta permanente puede intervenir una puesta a tierra.</li></ul></div>", "script": "En esta infografía comenzamos definiendo la carga eléctrica, una propiedad física de la materia que permite explicar atracciones y repulsiones eléctricas. Existen dos signos, positivo y negativo. Dos cargas del mismo signo se repelen; cargas de signos contrarios se atraen. En un cuerpo neutro, las contribuciones positivas y negativas se compensan.\nLa carga eléctrica está cuantizada. La expresión q igual a n multiplicado por e indica que la carga neta de un cuerpo ordinario corresponde a un múltiplo entero, con signo, del módulo de la carga elemental. Ese módulo vale aproximadamente uno coma seiscientos dos por diez elevado a menos diecinueve coulomb. El electrón tiene carga negativa, de signo menos; el protón tiene carga positiva. La fórmula utiliza e como módulo positivo.\nEl segundo punto es la conservación de la carga. En un sistema aislado, la suma algebraica total de cargas permanece constante. Por eso electrizar dos objetos no significa crear carga: usualmente significa transferir electrones o redistribuir los que ya existen. Si un cuerpo pierde electrones, queda con carga neta positiva; si gana electrones, queda con carga neta negativa.\nLa primera forma de electrización es por frotamiento. Al entrar en contacto y separarse dos materiales diferentes, puede producirse transferencia de electrones. El frotamiento aumenta las oportunidades de contacto, pero no es una fábrica de electrones. La cantidad y el signo de la carga dependen de los materiales y de sus superficies.\nLa segunda forma es por contacto. Un cuerpo cargado toca otro y se habilita el intercambio de carga. En el caso sencillo de dos conductores inicialmente aislados, uno cargado y otro neutro, las cargas se redistribuyen hasta alcanzar un equilibrio. No debemos suponer que siempre quedan con exactamente la misma carga: el resultado depende de su geometría y capacidad eléctrica.\nLa tercera forma es por inducción. Un cuerpo cargado cercano produce una redistribución de cargas en un conductor sin tocarlo. Esto se llama separación o polarización de cargas. Por sí sola, esa redistribución no implica que el conductor adquiera carga neta. Para obtener una carga neta permanente, puede conectarse a tierra mientras el inductor permanece cerca, retirar la conexión a tierra y finalmente alejar el inductor. El orden de las acciones importa.\nLa siguiente sección presenta la fuerza eléctrica. Coulomb determinó que el módulo de la fuerza entre dos cargas puntuales estacionarias en el vacío es igual a k por el valor absoluto del producto de las cargas dividido por la distancia al cuadrado. El valor absoluto se utiliza cuando hablamos del módulo; los signos determinan si la interacción es atractiva o repulsiva. Al duplicar la distancia, la fuerza pasa a ser una cuarta parte.\nTambién debemos comprender la polarización. Un cuerpo inicialmente neutro puede reorganizar levemente sus cargas ante un campo exterior. Esa distribución inducida puede producir una atracción neta, aunque la carga total del cuerpo siga siendo cero.\nTerminamos con una aplicación industrial: en el transporte de polvos, granos o materiales de envase puede acumularse electricidad estática por contacto y separación de superficies. Esa acumulación puede atraer partículas, interferir con operaciones o generar descargas. En zonas con atmósferas potencialmente explosivas se requieren evaluaciones de riesgo y medidas de prevención adecuadas. La conexión a tierra de partes conductoras es importante, pero no elimina por sí sola todos los riesgos de carga en materiales aislantes.\nLa conclusión es que la electrización se interpreta mejor observando qué cargas se transfieren, qué cargas solo se redistribuyen y qué condiciones permiten que el cuerpo mantenga su estado eléctrico.", "kind": "infographic", "sim": null}, {"title": "Material conductor y material aislante", "kicker": "MATERIALES", "body": "<ul><li><b>Conductor:</b> dispone de portadores de carga con gran movilidad; en metales son electrones.</li><li><b>Aislante:</b> dificulta el transporte macroscópico de carga, pero puede polarizarse.</li><li>El comportamiento depende del material, las condiciones y la geometría.</li></ul><p class=\"note\">Ejemplos: cobre y aluminio como conductores; vidrio seco, muchos plásticos y cerámicas como aislantes.</p>", "script": "Para comprender cómo se distribuye la carga, no alcanza con saber cuánta carga hay: también debemos conocer el material. En un conductor existen portadores con suficiente movilidad como para desplazarse macroscópicamente por el cuerpo. En metales, esos portadores son principalmente electrones libres. En un aislante o no conductor, en cambio, ese movimiento está muy limitado. Sin embargo, eso no significa que el aislante sea indiferente al campo eléctrico: puede polarizarse, es decir, deformar ligeramente la distribución interna de sus cargas positivas y negativas. Esta diferencia explica por qué un exceso de carga puede redistribuirse por toda la superficie de un conductor en equilibrio, mientras que en un aislante puede quedar más localizado en la región donde se depositó.", "kind": "concept", "sim": null}, {"title": "Comparación de materiales y cargas", "kicker": "MATERIALES · INFOGRAFÍA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/conductores_aislantes_electroscopio.png\" alt=\"Infografía: conductores, aislantes y electroscopio\"><p class=\"imgnote\">La lámina vincula movilidad de cargas, polarización y funcionamiento del electroscopio de hojas como detector cualitativo de carga.</p></div>", "script": "Esta infografía compara conductores, aislantes, polarización y electroscopio. El punto de partida es distinguir el material de la geometría, porque ambos influyen en la distribución de cargas.\nUn conductor posee portadores de carga que pueden desplazarse relativamente fácilmente. En un metal, los portadores móviles son principalmente electrones. Por eso una perturbación eléctrica provoca una redistribución de carga hasta alcanzar, si el sistema queda en reposo electrostático, una configuración de equilibrio. El cobre es un ejemplo habitual. También existen conductores cuya conducción depende de iones, como muchas soluciones acuosas con sales.\nUn aislante o no conductor presenta gran dificultad para el desplazamiento macroscópico de cargas. Vidrio seco y ciertos plásticos son ejemplos, aunque ningún aislante real tiene resistencia infinita. La humedad, la temperatura y la contaminación superficial pueden modificar mucho su comportamiento. Si se deposita carga sobre un aislante, puede permanecer localizada, en lugar de repartirse rápidamente por todo el cuerpo.\nEl tercer concepto es la polarización. Cuando acercamos una varilla cargada a un cuerpo aislante neutro, sus cargas ligadas pueden desplazarse ligeramente en sentidos opuestos, o sus dipolos orientarse. Se genera así una distribución microscópica de dipolos sin que necesariamente cambie la carga neta total. La polarización explica por qué un objeto neutro puede experimentar atracción hacia otro cargado.\nA continuación observamos el electroscopio de hojas. Está formado por un terminal metálico superior, una varilla conductora, dos hojas metálicas delgadas y una envolvente aislante que las protege. Si el sistema recibe una carga neta, esta se redistribuye por sus partes conductoras y las hojas pueden quedar con carga del mismo signo. Entonces se repelen y se separan.\nLa apertura angular surge de un equilibrio entre repulsión eléctrica y las fuerzas mecánicas asociadas al peso y la geometría de las hojas. En general una mayor carga produce una mayor apertura, pero no existe una ley universal sencilla que relacione directamente ángulo y cantidad de carga para cualquier aparato. Por eso el electroscopio tradicional es principalmente un detector cualitativo, no un medidor de alta precisión.\nVeamos los tres pasos representados. Primero, cargar: al tocar el terminal con un objeto cargado puede transferirse carga. Segundo, acercar: un objeto cargado próximo, aunque no toque el terminal, puede redistribuir las cargas y modificar la separación de las hojas. Si el electroscopio ya estaba cargado, esa separación puede aumentar o disminuir según el signo y la distribución inicial. Tercero, descargar o conectar a tierra: se permite el intercambio de carga con el entorno, y al restablecerse el estado neutro, en condiciones ideales, las hojas vuelven a quedar juntas.\nEn el simulador que acompaña a la presentación podemos modificar la carga y observar la variación del ángulo. El modelo debe interpretarse como una aproximación didáctica de equilibrio mecánico-electrostático, no como una calibración de un instrumento real.\nLa idea esencial de esta lámina es que la movilidad de cargas explica los fenómenos macroscópicos. La redistribución rápida en conductores, la polarización de aislantes y la apertura de hojas del electroscopio son distintas manifestaciones de interacciones eléctricas.", "kind": "infographic", "sim": null}, {"title": "Distribución de cargas en esferas", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"imgstack\"><img class=\"posterimg\" src=\"assets/distribucion_cargas_esferas.png\" alt=\"Infografía: distribución de cargas en esferas\"><iframe class=\"diagram\" title=\"Diagrama del tema\" src=\"assets/esferas.html\" style=\"height:360px\"></iframe><p class=\"imgnote\">La comparación distingue los casos conductor y no conductor, macizo y hueco, incluyendo campo interior, potencial y efecto de punta.</p></div>", "script": "La geometría esférica es especialmente útil porque posee alta simetría y permite comparar materiales distintos. En una esfera conductora aislada en equilibrio electrostático, la carga neta excedente se ubica en la superficie exterior. Si la esfera es hueca y no hay carga en la cavidad, el resultado sigue siendo el mismo: el campo en la cavidad es nulo y la carga queda afuera. En una esfera maciza aislante con carga volumétrica uniforme, en cambio, la carga está distribuida en todo el volumen, de modo que la carga encerrada crece con el radio. En una cáscara aislante ideal, la carga puede modelarse como distribuida uniformemente sobre la superficie. Estas diferencias producen comportamientos distintos de campo y potencial en el interior.", "kind": "infographic", "sim": null}, {"title": "Fuerza eléctrica: ley de Coulomb", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"formula\">F = k |q₁q₂| / r²</div><ul><li>Para cargas puntuales estacionarias, la fuerza actúa sobre la recta que las une.</li><li>Mismo signo: repulsión; signos opuestos: atracción.</li><li>La distancia interviene al cuadrado.</li></ul>", "script": "La ley de Coulomb cuantifica la interacción entre dos cargas puntuales en reposo. El módulo de la fuerza crece con los módulos de las cargas y disminuye con el cuadrado de la distancia que las separa. La fuerza siempre actúa sobre la recta que une las cargas: si tienen el mismo signo, la interacción es repulsiva; si tienen signo opuesto, es atractiva. Aunque la ecuación parece simple, encierra varias ideas importantes. Primero, que la interacción depende de una constante del medio; en vacío o aire suele utilizarse la constante k. Segundo, que la ley es vectorial: para resolver problemas reales debemos considerar dirección y sentido. Y tercero, que sirve como base para definir luego el campo eléctrico como fuerza por unidad de carga de prueba positiva.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Coulomb", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Fuerza eléctrica entre dos cargas</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Fuerza eléctrica entre dos cargas\" data-sim=\"s4\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En esta simulación conviene trabajar con dos preguntas. La primera es cómo cambia el módulo de la fuerza cuando modificamos una sola variable y mantenemos las demás constantes. Si duplicamos una de las cargas, la fuerza se duplica; si duplicamos la distancia, la fuerza disminuye a la cuarta parte. La segunda pregunta es cómo cambia el sentido de la interacción al cambiar el signo de las cargas. Observen que la simulación no solamente entrega números: permite vincular la expresión matemática con el comportamiento físico de atracción y repulsión. Intenten anticipar el resultado antes de mover los controles, y luego comparen la predicción con el valor calculado.", "kind": "lab", "sim": "s4"}, {"title": "Electroscopio de hojas", "kicker": "ELECTROSTÁTICA", "body": "<ul><li>Detecta electrización por separación de dos hojas conductoras.</li><li>La repulsión eléctrica tiende a abrirlas; las acciones mecánicas se oponen.</li><li>Puede cargarse por contacto y experimentar polarización por inducción.</li></ul>", "script": "El electroscopio de hojas metálicas es un instrumento cualitativo para detectar electrización y comparar estados de carga. Está formado por un terminal conductor, una varilla y dos hojas muy livianas. Cuando el sistema recibe carga, ésta se redistribuye por el conductor y ambas hojas quedan con carga del mismo signo. Como cargas del mismo signo se repelen, las hojas se separan. La apertura angular no es arbitraria: surge de un equilibrio entre la repulsión eléctrica y las acciones mecánicas que tienden a cerrar las hojas, como el peso y la geometría del sistema. El electroscopio también permite discutir electrización por contacto, por inducción y descarga a tierra, por eso funciona como un excelente puente entre los conceptos microscópicos y la evidencia experimental visible.", "kind": "concept", "sim": null}, {"title": "Laboratorio: cargar y descargar un electroscopio", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Electroscopio de hojas: carga, descarga e inducción</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Electroscopio de hojas: carga, descarga e inducción\" data-sim=\"selectro\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En el laboratorio del electroscopio conviene observar la secuencia completa. Partan del estado neutro y carguen el instrumento con un signo determinado: las hojas se abren porque ambas adquieren carga del mismo signo. Luego descarguen o conecten a tierra y verifiquen que la apertura disminuye. Ensayen también la aproximación de un cuerpo cargado sin contacto. Allí no necesariamente se transfiere carga neta; puede aparecer una redistribución inducida. La gráfica de apertura angular frente a la carga ayuda a recordar que el modelo es pedagógico: busca representar la tendencia física general, no reproducir con exactitud metrológica un instrumento comercial.", "kind": "lab", "sim": "selectro"}, {"title": "Campo eléctrico y líneas de campo", "kicker": "CAMPO ELÉCTRICO", "body": "<div><a href=\"assets/infografia_campo_electrico.png\" target=\"_blank\" rel=\"noopener\" title=\"Ampliar infografía\"><img class=\"u7poster-integrated\" src=\"assets/infografia_campo_electrico.png\" alt=\"Campo eléctrico: líneas de campo y comportamiento E(r) en cuatro distribuciones esféricas.\"><\/a><p class=\"u7poster-caption\">Campo eléctrico: líneas de campo y comportamiento E(r) en cuatro distribuciones esféricas. <a class=\"u7poster-zoom\" href=\"assets/infografia_campo_electrico.png\" target=\"_blank\" rel=\"noopener\">Abrir en tamaño completo<\/a><\/p><\/div><div class=\"formula\"><strong>E<\/strong> = <strong>F<\/strong> / q<sub>prueba<\/sub><\/div><ul><li>El vector <b>campo eléctrico<\/b> indica la fuerza por unidad de carga de prueba positiva.<\/li><li>Las <b>líneas de campo<\/b> muestran dirección y sentido del campo en cada punto.<\/li><li>Las <b>superficies equipotenciales<\/b> unen puntos de igual potencial y son perpendiculares al campo.<\/li><\/ul><div class=\"twodiag\"><iframe class=\"diagram\" title=\"Líneas de campo de cargas positiva y negativa\" src=\"assets/campo_pos_neg.html\"><\/iframe><iframe class=\"diagram\" title=\"Líneas de campo y equipotenciales\" src=\"assets/lineas_equipotenciales.html\"><\/iframe><\/div><div><a href=\"assets/infografia_lineas_campo.png\" target=\"_blank\" rel=\"noopener\" title=\"Ampliar infografía\"><img class=\"u7poster-integrated\" src=\"assets/infografia_lineas_campo.png\" alt=\"Líneas de campo eléctrico: reglas, configuraciones clásicas y ejemplos.\"><\/a><p class=\"u7poster-caption\">Líneas de campo eléctrico: reglas de representación y configuraciones clásicas. <a class=\"u7poster-zoom\" href=\"assets/infografia_lineas_campo.png\" target=\"_blank\" rel=\"noopener\">Abrir en tamaño completo<\/a><\/p><\/div>", "script": "En esta filmina conviene mirar la infografía como un mapa de configuraciones clásicas del campo eléctrico. Las líneas de campo son una representación gráfica: en cada punto, la tangente a la línea indica la dirección del campo, y el sentido de la flecha muestra hacia dónde sería empujada una carga de prueba positiva. Estas líneas no son objetos materiales ni trayectorias obligatorias; son una herramienta visual para interpretar un campo vectorial. La densidad de líneas se usa como un indicador cualitativo de intensidad: donde aparecen más concentradas, el campo es más intenso. La infografía reúne los casos más importantes. Una carga puntual positiva genera líneas salientes; una negativa, líneas entrantes. Dos cargas de signo opuesto forman un dipolo, donde las líneas parten de la positiva y terminan en la negativa. Dos cargas del mismo signo muestran una región de repulsión y una línea o zona de simetría donde el campo puede disminuir o incluso anularse. También se muestran distribuciones extensas, como una línea cargada, un plano o dos placas paralelas, que permiten reconocer campos con distinta geometría. En el aro cargado y en las configuraciones con formas agudas o superficies cóncavas, la infografía ayuda a comprender cómo la geometría del conductor o de la distribución modifica la forma del campo. Pedagógicamente, esta lámina es importante porque permite pasar del concepto abstracto de campo a una lectura visual de la interacción eléctrica.", "kind": "concept", "sim": null}, {"title": "Superposición de campos", "kicker": "CAMPO ELÉCTRICO", "body": "<div class=\"formula\">𝐄<sub>R</sub> = 𝐄₁ + 𝐄₂ + …</div><ul><li>La suma es vectorial: deben considerarse módulo, dirección y sentido.</li><li>En puntos de simetría puede haber cancelación parcial o total.</li><li>Campo nulo no implica ausencia de cargas; significa que los aportes se compensan en ese punto.</li></ul><p class=\"note\">En el análisis conviene dibujar cada vector campo antes de realizar la suma.</p>", "script": "Cuando varias cargas están presentes, cada una contribuye con su propio campo en el punto de interés. El campo total no se obtiene sumando solamente números, sino realizando una suma vectorial. Por eso, en un problema de superposición conviene dibujar primero el campo aportado por cada fuente, con su dirección y sentido. En puntos de simetría puede ocurrir que dos o más contribuciones se anulen exactamente, de modo que el campo resultante sea nulo aunque ninguna de las cargas individuales deje de existir. Esta idea es muy importante: campo nulo no significa ausencia de fuentes, sino compensación entre aportes. La superposición es un principio general y reaparece luego en circuitos, magnetismo y otras áreas de la física.", "kind": "concept", "sim": null}, {"title": "Ley de Gauss: idea física", "kicker": "CAMPO ELÉCTRICO", "body": "<div><a href=\"assets/infografia_teorema_gauss.png\" target=\"_blank\" rel=\"noopener\" title=\"Ampliar infografía\"><img class=\"u7poster-integrated\" src=\"assets/infografia_teorema_gauss.png\" alt=\"Teorema de Gauss: enunciado, interpretación y ejemplos básicos.\"><\/a><p class=\"u7poster-caption\">Teorema de Gauss: enunciado, interpretación física y ejemplos básicos. <a class=\"u7poster-zoom\" href=\"assets/infografia_teorema_gauss.png\" target=\"_blank\" rel=\"noopener\">Abrir en tamaño completo<\/a><\/p><\/div><div class=\"formula\">&Phi;<sub>E<\/sub> = &oint;<sub>S<\/sub> <strong>E<\/strong> &middot; d<strong>A<\/strong> = Q<sub>enc<\/sub> / &epsilon;<sub>0<\/sub><\/div><ul><li>El <b>flujo eléctrico<\/b> mide cuánto campo atraviesa una superficie cerrada.<\/li><li>La ley de Gauss es general, pero se vuelve especialmente potente cuando hay <b>simetría<\/b>.<\/li><li>La carga que interviene en el resultado es la <b>encerrada<\/b> por la superficie gaussiana, no la que queda fuera.<\/li><\/ul><p class=\"note\">En geometrías esféricas, cilíndricas y planas la simetría permite elegir superficies gaussianas que simplifican el cálculo del campo.<\/p>", "script": "Esta filmina no debe leerse solo como un enunciado matemático. La infografía organiza el teorema de Gauss como una herramienta de análisis físico. La idea central es que el flujo del campo eléctrico a través de una superficie cerrada depende únicamente de la carga neta encerrada en esa superficie. En la expresión mostrada, el símbolo Phi sub E representa el flujo eléctrico; el integral cerrado indica que se suma la contribución del campo sobre toda la superficie cerrada; y Q sub enc representa la carga encerrada. Lo importante es interpretar qué nos permite hacer esta relación. Si la distribución de carga tiene suficiente simetría, podemos elegir una superficie gaussiana en la cual el módulo del campo sea constante o tenga una dirección simple. Entonces la integral deja de ser un obstáculo y se transforma en una cuenta accesible. La infografía muestra justamente los ejemplos básicos en los que esto funciona mejor. En una carga puntual, la superficie natural es una esfera concéntrica. En una esfera maciza aislante uniformemente cargada, el campo interior se obtiene porque la carga encerrada crece con el volumen. En una esfera conductora en equilibrio, el campo interior es nulo y la carga neta queda en la superficie. En un hilo muy largo, la superficie más conveniente es un cilindro coaxial. En un plano infinito cargado, la superficie útil es una pastilla cilíndrica que atraviesa el plano. Todos estos casos enseñan la misma lección: la ley de Gauss es general, pero su potencia práctica depende de elegir bien la superficie y de reconocer la simetría física del problema.", "kind": "concept", "sim": null}, {"title": "Laboratorio 3D: esfera uniformemente cargada", "kicker": "SIMULACIÓN 3D · GAUSS", "body": "<div class=\"labdesc\">Simulador original de la esfera maciza aislante con carga volumétrica uniforme, campo y potencial.</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulador tridimensional de Gauss\" data-static=\"assets/gauss.html\" src=\"about:blank\"></iframe><p class=\"muted\">Three.js y MathJax requieren conexión a Internet en esta versión del simulador.</p>", "script": "Este simulador debe leerse a la luz de la hipótesis del modelo: se trata de una esfera maciza aislante con carga distribuida uniformemente en el volumen. No describe una esfera conductora. Al variar el radio de la superficie gaussiana, observen tres regiones. Dentro de la esfera, la carga encerrada crece con el volumen y por eso el campo aumenta con el radio. En la superficie se alcanza el valor máximo del campo. Fuera de la esfera, toda la carga ya está encerrada y el campo decrece como uno sobre r cuadrado, igual que para una carga puntual equivalente. Comparen además el gráfico del potencial. Allí verán que el potencial es continuo y que su comportamiento interior difiere claramente del caso conductor.", "kind": "lab", "sim": "gauss"}, {"title": "Campo y potencial en distribuciones esféricas", "kicker": "COMPARACIÓN", "body": "<p class=\"lead\">Tres objetos con <b>la misma carga total positiva Q</b> y <b>el mismo radio R</b>: ¿qué ocurre dentro, en la superficie y fuera?</p><div class=\"note\"><b>Cómo leer:</b> el eje horizontal es r/R; la línea vertical marca r=R. El campo y el potencial se expresan en escalas relativas para comparar formas, no valores absolutos.</div><iframe class=\"widegraph\" style=\"height:clamp(760px,115vh,1250px)\" title=\"Comparación explicada de campo y potencial de tres distribuciones esféricas\" src=\"assets/potencial_esferas_didactico.html\"></iframe><p class=\"note\"><b>Idea física:</b> campo nulo significa potencial <i>constante</i>, no necesariamente potencial cero. El potencial es continuo en la superficie de los tres modelos; el campo puede presentar un salto en una capa superficial cargada.</p>", "script": "Esta filmina compara cómo cambian el campo y el potencial en varias distribuciones esféricas, y su objetivo no es memorizar curvas, sino entender qué información física transmite cada una. En una esfera maciza aislante con carga volumétrica uniforme, la carga encerrada aumenta a medida que crece el radio, por eso el campo interior aumenta linealmente desde el centro hasta la superficie. En cambio, el potencial interior cambia de manera suave y cuadrática. En una cáscara esférica cargada y en una esfera conductora en equilibrio, el campo interior es nulo, pero el potencial no desaparece: queda constante e igual al valor de la superficie. Fuera del objeto, en todos los casos el comportamiento recupera el de una carga puntual equivalente ubicada en el centro. La importancia de esta comparación es doble. Primero, muestra que campo y potencial no son la misma cosa: uno es vectorial y está asociado a la fuerza; el otro es escalar y está asociado a la energía. Segundo, enseña a leer las gráficas como descripciones del fenómeno: la pendiente del potencial está relacionada con el campo, y una región con potencial constante corresponde a campo nulo. Esta lectura es esencial para que las imágenes no se transformen en simples dibujos sin interpretación.", "kind": "concept", "sim": null}, {"title": "Potencial eléctrico y diferencia de potencial", "kicker": "ENERGÍA", "body": "<div><a href=\"assets/infografia_potencial_voltaje_medicion.png\" target=\"_blank\" rel=\"noopener\" title=\"Ampliar infografía\"><img class=\"u7poster-integrated\" src=\"assets/infografia_potencial_voltaje_medicion.png\" alt=\"Potencial eléctrico, diferencia de potencial y medición con batería y voltímetro.\"><\/a><p class=\"u7poster-caption\">Potencial eléctrico, diferencia de potencial y medición. <a class=\"u7poster-zoom\" href=\"assets/infografia_potencial_voltaje_medicion.png\" target=\"_blank\" rel=\"noopener\">Abrir en tamaño completo<\/a><\/p><\/div><div><a href=\"assets/infografia_potencial_electrico.png\" target=\"_blank\" rel=\"noopener\" title=\"Ampliar infografía\"><img class=\"u7poster-integrated\" src=\"assets/infografia_potencial_electrico.png\" alt=\"Potencial eléctrico: equipotenciales y comportamiento V(r) en modelos esféricos.\"><\/a><p class=\"u7poster-caption\">Curvas de potencial y equipotenciales en distribuciones clásicas. <a class=\"u7poster-zoom\" href=\"assets/infografia_potencial_electrico.png\" target=\"_blank\" rel=\"noopener\">Abrir en tamaño completo<\/a><\/p><\/div><div class=\"formula\">V = U / q<\/div><div class=\"formula\">ΔV = ΔU / q<\/div><ul><li>El potencial es energía potencial eléctrica por unidad de carga.<\/li><li>La diferencia de potencial es la magnitud que medimos con un voltímetro.<\/li><li>Las líneas de campo son perpendiculares a las superficies equipotenciales.<\/li><\/ul><iframe class=\"widegraph\" title=\"Equipotenciales y campo eléctrico\" src=\"assets/lineas_equipotenciales.html\"><\/iframe>", "script": "Esta filmina integra dos ideas que en los libros suelen presentarse por separado, pero que en la práctica conviene estudiar juntas. La primera infografía introduce el potencial eléctrico y la diferencia de potencial a partir de su significado energético. El potencial es la energía potencial eléctrica por unidad de carga, mientras que la diferencia de potencial indica cuánta energía gana o pierde cada coulomb de carga al pasar de un punto a otro. Por eso el volt se interpreta como joule por coulomb. La misma lámina muestra un voltímetro conectado a una batería para remarcar que, en laboratorio o en un circuito real, lo que medimos es siempre una diferencia de potencial entre dos puntos. La batería aparece como una fuente que mantiene esa diferencia de potencial entre sus bornes y entrega energía a las cargas del circuito. La segunda infografía amplía la mirada y compara cómo se comporta el potencial en distintas distribuciones esféricas, además de relacionarlo con las superficies equipotenciales. Esa comparación es importante porque permite distinguir potencial y campo. El potencial es una magnitud escalar asociada a energía por unidad de carga; el campo es una magnitud vectorial asociada a la fuerza por unidad de carga. Las equipotenciales ayudan a visualizar que el campo es perpendicular a ellas, y las curvas de V en función de la distancia muestran que un conductor puede tener campo interior nulo y, sin embargo, potencial constante distinto de cero. En conjunto, la filmina relaciona definición, interpretación física, medición y modelización.", "kind": "concept", "sim": null}, {"title": "Conductores en equilibrio y efecto de punta", "kicker": "ELECTROSTÁTICA", "body": "<div class=\"stackblock\"><img class=\"slideimg\" src=\"assets/conductores_equilibrio_punta.png\" alt=\"Infografía sobre conductores en equilibrio electrostático y efecto de punta\"><p class=\"imgcaption\">La imagen resume dos ideas centrales: en equilibrio electrostático la carga libre queda en la superficie y el campo interior es nulo; en regiones agudas, las cargas se concentran más y el campo exterior aumenta.</p><ul><li>En equilibrio electrostático, el campo en el material conductor es nulo.</li><li>Todo el conductor queda al mismo potencial: es <b>equipotencial</b>.</li><li>La carga libre se acumula en la superficie y se concentra más en regiones de gran curvatura.</li><li>Ese aumento local del campo explica el <b>efecto de punta</b>, el efecto corona y el fundamento del blindaje electrostático.</li></ul></div>", "script": "La imagen de esta filmina representa dos ideas muy importantes de la electrostática de conductores. En el panel del conductor en equilibrio se muestra que las cargas libres terminan redistribuyéndose sobre la superficie, de manera que el campo en el interior del material conductor es nulo. Si existiera un campo interior, las cargas seguirían moviéndose y el equilibrio no se habría alcanzado. Por eso decimos también que el conductor completo queda al mismo potencial: es equipotencial. En el segundo panel se observa el efecto de punta. Allí la geometría deja de ser un detalle y pasa a tener importancia física. En regiones agudas o de gran curvatura, la densidad superficial de carga aumenta y el campo exterior resulta más intenso. Esto ayuda a comprender por qué las descargas eléctricas se favorecen en zonas en punta y cuál es el principio físico detrás del pararrayos y del efecto corona. La imagen, entonces, no solo ilustra un dibujo bonito: conecta geometría, distribución de carga, intensidad del campo y aplicaciones tecnológicas concretas.", "kind": "concept", "sim": null}, {"title": "Corriente, resistencia y ley de Ohm", "kicker": "CIRCUITOS", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_corriente_sentido.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_corriente_sentido.png\" alt=\"Infografía sobre corriente eléctrica y sentido convencional de la corriente\" loading=\"lazy\"><\/a><figcaption>Corriente eléctrica y sentido de la corriente. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><figure class=\"infografia-u7\"><a href=\"assets/infografia_corriente_tension_resistencia.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_corriente_tension_resistencia.png\" alt=\"Infografía corriente, tensión y resistencia: definiciones, ley de Ohm, geometría, gráfico y ejemplo\" loading=\"lazy\"><\/a><figcaption>Corriente, tensión y resistencia: conceptos, relaciones y ejemplos. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><figure class=\"infografia-u7\"><a href=\"assets/infografia_ley_ohm_relacion.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_ley_ohm_relacion.png\" alt=\"Infografía sobre ley de Ohm, corriente, tensión y resistencia\" loading=\"lazy\"><\/a><figcaption>Ley de Ohm: relación entre corriente, tensión y resistencia. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><figure class=\"infografia-u7\"><a href=\"assets/infografia_resistencia_materiales_ohm.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_resistencia_materiales_ohm.png\" alt=\"Infografía de profundización sobre resistencia, materiales y validez de Ohm\" loading=\"lazy\"><\/a><figcaption>Profundización teórica: resistencia, materiales y validez de Ohm. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><h3>Lectura integrada<\/h3><ul><li><b>Corriente I:<\/b> cantidad de carga que atraviesa una sección por unidad de tiempo.<\/li><li><b>Tensión ΔV:<\/b> energía transferida por unidad de carga entre dos puntos.<\/li><li><b>Resistencia R:<\/b> oposición que presenta un material o componente al paso de la corriente.<\/li><\/ul><div class=\"formula\">I = ΔQ / Δt<\/div><div class=\"formula\">ΔV = R · I &nbsp; (resistor óhmico)<\/div><p>Las infografías inferiores refuerzan la ley de Ohm, la influencia de la geometría del conductor, la naturaleza de los materiales y la interpretación de la gráfica <b>V frente a I<\/b>.<\/p>", "script": "Esta filmina concentra los conceptos básicos que permiten pasar de la electrostática al análisis de circuitos y ahora agrega una capa de profundización teórica. La primera infografía define la corriente como flujo ordenado de cargas y aclara un punto imprescindible para leer esquemas: el sentido convencional de corriente se toma como si se desplazaran cargas positivas desde el polo positivo al negativo en el circuito externo. En los metales, sin embargo, las cargas móviles son electrones y su movimiento real ocurre en sentido contrario. La segunda y la tercera infografía integran corriente, tensión y resistencia. La tensión o diferencia de potencial expresa cuánta energía recibe cada coulomb de carga, mientras que la corriente indica cuánta carga circula por unidad de tiempo. La resistencia describe la oposición que ofrece un elemento al paso de la corriente. En un resistor óhmico, a temperatura aproximadamente constante, tensión y corriente son proporcionales; esa proporcionalidad se expresa mediante la ley de Ohm. La nueva infografía de profundización amplía esta lectura y deja claro que la resistencia depende del material, de la resistividad, de la longitud, del área de la sección y, en muchos casos, de la temperatura. También remarca que la ley de Ohm no es una verdad universal para cualquier dispositivo y en cualquier condición: describe el comportamiento de materiales o componentes óhmicos dentro de cierto rango de trabajo. Por eso la filmina diferencia comportamientos óhmicos, donde la gráfica V en función de I es lineal, de comportamientos no óhmicos, donde la proporcionalidad deja de cumplirse. Este cierre es importante porque transforma a la ley de Ohm en un modelo físico con hipótesis de validez, y no en una simple fórmula para reemplazar números.", "kind": "concept", "sim": null}, {"title": "Laboratorio: ley de Ohm", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Resistencia, tensión, corriente y gráfico de Ohm</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Resistencia, tensión, corriente y gráfico de Ohm\" data-sim=\"s8\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "Usen la simulación para relacionar tres registros de una misma situación física: la ecuación, la tabla de valores y la gráfica tensión-corriente. Para una resistencia fija, verifiquen que al aumentar la tensión aumenta proporcionalmente la corriente. Luego mantengan constante la tensión y modifiquen la resistencia para observar cómo cambia la corriente. Presten atención a la recta V contra I: su pendiente representa la resistencia del elemento. Si el comportamiento es lineal, estamos frente a un modelo óhmico. El objetivo no es sólo calcular un valor, sino interpretar qué significa la pendiente, qué magnitud queda representada en cada eje y cómo se reconoce experimentalmente una relación proporcional.", "kind": "lab", "sim": "s8"}, {"title": "Potencia y energía eléctrica", "kicker": "CIRCUITOS", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_energia_tension_corriente.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_energia_tension_corriente.png\" alt=\"Infografía sobre relación entre energía, tensión y corriente\" loading=\"lazy\"><\/a><figcaption>Relación entre energía, tensión y corriente en un circuito. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">P = V I = I²R = V²/R<\/div><div class=\"formula\">W = P t<\/div><p>La fuente transfiere energía a las cargas, la tensión expresa energía por unidad de carga y la corriente cuantifica el flujo de carga. La potencia describe la rapidez con que esa transferencia energética ocurre.<\/p><p>La energía eléctrica consumida puede expresarse en joules o kilowatt-hora.<\/p>", "script": "Esta filmina retoma la relación entre energía, tensión y corriente para preparar el concepto de potencia eléctrica. La infografía muestra primero el papel de la fuente: una batería o generador suministra energía a las cargas y mantiene una diferencia de potencial entre sus terminales. Esa diferencia de potencial, o tensión, indica cuánta energía se transfiere por cada coulomb de carga. Si el circuito está cerrado, esa energía permite el desplazamiento ordenado de las cargas y aparece la corriente. La imagen es valiosa porque muestra la secuencia física completa: fuente, transferencia de energía por unidad de carga, movimiento de cargas y corriente resultante. A partir de esa base, la potencia eléctrica puede entenderse como la rapidez con que se transfiere o transforma energía. Por eso, multiplicar tensión por corriente entrega la potencia instantánea en un elemento. Si esa potencia se mantiene durante un intervalo de tiempo, la energía transferida se obtiene multiplicando potencia por tiempo. Esta lectura conecta con aplicaciones tecnológicas concretas, como el consumo de equipos eléctricos, el calentamiento resistivo y la estimación energética en procesos.", "kind": "concept", "sim": null}, {"title": "Laboratorio: potencia y energía", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Consumo eléctrico y calentamiento resistivo</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Consumo eléctrico y calentamiento resistivo\" data-sim=\"s9\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En la simulación comparen dos niveles de análisis. Primero, el instantáneo: observen cómo cambian corriente y potencia cuando modifican tensión o resistencia. Segundo, el acumulativo: sigan la energía consumida a lo largo del tiempo. Un mismo equipo puede tener una potencia moderada pero, si funciona durante mucho tiempo, acumular una energía significativa. Relacionen esos resultados con situaciones concretas de proceso, como el uso de resistencias calefactoras. El gráfico de energía permite ver que la pendiente está asociada a la potencia: cuanto mayor es la potencia, más rápidamente crece la energía acumulada.", "kind": "lab", "sim": "s9"}, {"title": "Circuitos: serie, paralelo y mixtos", "kicker": "CIRCUITOS", "body": "<ul><li>En serie, la misma corriente atraviesa cada elemento.</li><li>En paralelo, las ramas comparten diferencia de potencial.</li><li>Los circuitos mixtos combinan ambas configuraciones.</li></ul>", "script": "Para analizar circuitos no alcanza con reconocer símbolos; es necesario identificar cómo están conectados los elementos. En una conexión en serie, la misma corriente atraviesa todos los componentes porque no hay ramificaciones entre ellos. En una conexión en paralelo, los elementos comparten los mismos nodos extremos, de modo que tienen la misma diferencia de potencial. Los circuitos mixtos combinan ambas configuraciones y requieren simplificar por etapas, respetando la topología real del circuito. Estas ideas son fundamentales porque la distribución de tensiones y corrientes depende de la forma de conexión, no solo de los valores de las resistencias. Antes de calcular, siempre conviene preguntarse: ¿qué magnitudes son comunes y cuáles se reparten?", "kind": "concept", "sim": null}, {"title": "Laboratorio: circuitos resistivos", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Asociación de resistores en serie, paralelo y mixto</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Asociación de resistores en serie, paralelo y mixto\" data-sim=\"s10\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En este laboratorio trabajen paso a paso. Identifiquen primero qué resistencias están claramente en serie y cuáles están en paralelo. Luego calculen o estimen la resistencia equivalente y recién después miren los resultados del simulador. Observen cómo se distribuyen corriente y tensión según la configuración. En serie, la corriente es la misma y las tensiones parciales se suman. En paralelo, la tensión de rama es la misma y las corrientes se reparten. El objetivo es que la equivalencia no se vea como un truco algebraico, sino como una herramienta para describir cómo responde el circuito completo frente a una fuente dada.", "kind": "lab", "sim": "s10"}, {"title": "Leyes de Kirchhoff", "kicker": "CIRCUITOS", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_kirchhoff_fundamentos.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_kirchhoff_fundamentos.png\" alt=\"Infografía sobre leyes de Kirchhoff: fundamentos, convenciones y circuito de una malla\" loading=\"lazy\"><\/a><figcaption>Leyes de Kirchhoff: fundamentos, convenciones y ejemplo de una malla. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">Ley de nodos: Σ I = 0<\/div><div class=\"formula\">Ley de mallas: Σ ΔV = 0<\/div><ul><li>La ley de nodos expresa conservación de la carga.<\/li><li>La ley de mallas expresa conservación de la energía.<\/li><li>Los signos dependen del recorrido elegido y de la polaridad asignada a cada elemento.<\/li><\/ul><h3>Ejercicio práctico 1<\/h3><p>Fuente de 12 V y resistencias R<sub>1<\/sub>=4 Ω, R<sub>2<\/sub>=2 Ω y R<sub>3<\/sub>=6 Ω en una sola malla. Planteo: <b>12 − 4I − 2I − 6I = 0<\/b>. Resultado: <b>I = 1,0 A<\/b>.<\/p>", "script": "Esta filmina incorpora una infografía de síntesis sobre las leyes de Kirchhoff. La imagen recuerda que la ley de corrientes se aplica en los nodos y que la ley de tensiones se aplica en las mallas. Ambas no son reglas arbitrarias: representan la conservación de la carga y la conservación de la energía en el modelo de circuitos. La infografía también fija las convenciones de signos. En una resistencia, si la recorremos en el mismo sentido de la corriente, aparece una caída de potencial. En una fuente, pasar del borne negativo al positivo significa una elevación de potencial. Ese criterio es el que permite escribir ecuaciones consistentes. En la mitad inferior se desarrolla un ejemplo de una sola malla con una fuente de doce voltios y tres resistencias en serie. El planteo algebraico es doce menos cuatro I menos dos I menos seis I igual a cero, y de allí se obtiene una corriente de uno coma cero ampere. Este primer ejercicio es importante porque muestra el procedimiento más simple y sienta la base para el caso de varias mallas.", "kind": "concept", "sim": null}, {"title": "Laboratorio: Kirchhoff", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_kirchhoff_dos_mallas.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_kirchhoff_dos_mallas.png\" alt=\"Infografía sobre circuito de dos mallas con leyes de Kirchhoff\" loading=\"lazy\"><\/a><figcaption>Ejemplo de dos mallas con resistor compartido. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><h3>Ejercicio práctico 2<\/h3><p>Dos mallas con ε<sub>1<\/sub>=12 V, ε<sub>2<\/sub>=6 V, R<sub>1<\/sub>=4 Ω, R<sub>2<\/sub>=6 Ω y R<sub>3<\/sub>=2 Ω. Corrientes de malla I<sub>1<\/sub> e I<sub>2<\/sub>, ambas en sentido horario.<\/p><ul><li>Malla 1: <b>+12 − 4I<sub>1<\/sub> − 2(I<sub>1<\/sub> − I<sub>2<\/sub>) = 0<\/b><\/li><li>Malla 2: <b>+6 − 6I<sub>2<\/sub> − 2(I<sub>2<\/sub> − I<sub>1<\/sub>) = 0<\/b><\/li><li>Resultados: <b>I<sub>1<\/sub> = 2,45 A<\/b>, <b>I<sub>2<\/sub> = 1,35 A<\/b>, <b>I<sub>3<\/sub> = I<sub>1<\/sub> − I<sub>2<\/sub> = 1,10 A<\/b>.<\/li><\/ul><div class=\"labdesc\">Simulación interactiva: dos mallas resistivas con rama compartida<\/div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Dos mallas resistivas con rama compartida\" data-sim=\"s11\" src=\"about:blank\"><\/iframe><p class=\"muted\">Primero planteá el sistema a mano y luego contrastá el resultado con el simulador.<\/p>", "script": "En esta filmina se incorpora la segunda infografía, dedicada a un circuito de dos mallas con una resistencia compartida. La imagen muestra de manera explícita las corrientes de malla elegidas, las polaridades en las resistencias y las fuentes, el sistema de ecuaciones y la verificación de resultados. Ese nivel de detalle es importante porque en Kirchhoff los signos no se improvisan: dependen del sentido de recorrido y de la polaridad adoptada. El ejercicio práctico dos propone resolver el sistema correspondiente. En la resistencia compartida la corriente física no es simplemente I uno ni I dos, sino la diferencia algebraica entre ambas, según los sentidos definidos. Los resultados obtenidos, I uno igual a dos coma cuarenta y cinco amperes e I dos igual a uno coma treinta y cinco amperes, permiten calcular también la corriente de la rama central. Después de analizar la infografía, utilicen el simulador para modificar valores de fuentes y resistencias, y observen cómo cambia el sistema. La recomendación metodológica es siempre la misma: identificar corrientes, fijar polaridades, escribir ecuaciones, resolver y verificar.", "kind": "lab", "sim": "s11"}, {"title": "Magnetismo y fuerzas magnéticas", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">𝐅 = q(𝐯 × 𝐁)</div><ul><li>Las corrientes eléctricas generan campo magnético.</li><li>Sobre una carga en movimiento puede actuar una fuerza perpendicular a la velocidad y al campo.</li><li>Bobinas y conductores permiten construir electroimanes y motores.</li></ul>", "script": "El magnetismo completa el cuadro electromagnético. Un campo magnético puede originarse en un imán permanente o en cargas en movimiento, es decir, corrientes eléctricas. La fuerza magnética sobre una carga móvil es perpendicular tanto a la velocidad como al campo, de modo que tiende a desviar la trayectoria más que a cambiar directamente la rapidez. Esta característica distingue al magnetismo del caso eléctrico simple. En conductores recorridos por corriente, la interacción entre corriente y campo magnético está en la base de motores, relés y numerosos actuadores. Al estudiar estas fuerzas conviene recordar que la orientación depende de una regla vectorial, usualmente expresada mediante el producto vectorial y la regla de la mano derecha.", "kind": "concept", "sim": null}, {"title": "Inducción electromagnética", "kicker": "ELECTROMAGNETISMO", "body": "<div class=\"formula\">ℰ = −N ΔΦ<sub>B</sub> / Δt</div><ul><li>Una variación de flujo magnético produce fuerza electromotriz inducida.</li><li>La ley de Lenz establece el sentido de oposición al cambio del flujo.</li><li>Fundamento de generadores, transformadores y numerosos sensores.</li></ul>", "script": "La inducción electromagnética aparece cuando cambia el flujo magnético enlazado con un circuito. No alcanza con tener campo magnético: debe haber una variación de flujo, ya sea por cambio del campo, del área, de la orientación o del movimiento relativo entre imán y circuito. La ley de Faraday relaciona la fuerza electromotriz inducida con la rapidez de ese cambio. El signo negativo expresa la ley de Lenz: la corriente inducida genera efectos que se oponen a la variación que la produce. Esta idea es esencial porque introduce una realimentación física. Generadores, transformadores, cocinas de inducción y múltiples sensores aprovechan, de una u otra forma, este mismo principio.", "kind": "concept", "sim": null}, {"title": "Bobinas: de la corriente al campo magnético", "kicker": "CAMPO MAGNÉTICO", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_campo_magnetico_conductores_bobinas.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_campo_magnetico_conductores_bobinas.png\" alt=\"Infografía sobre campo magnético en conductores y bobinas\" loading=\"lazy\"><\/a><figcaption>Campo magnético en conductores y bobinas. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">Conductor largo: B = μ I / (2πr)<\/div><div class=\"formula\">Solenoide ideal: B ≈ μ (N/ℓ) I<\/div><ul><li>Compara conductor recto, espira circular y solenoide.<\/li><li>Integra regla de la mano derecha, intensidad del campo y efecto del núcleo.<\/li><li>Vincula el concepto con electroimanes, relés, válvulas y actuadores.<\/li><\/ul>", "script": "Esta filmina incorpora una infografía amplia sobre campo magnético en conductores y bobinas. La lámina ordena el tema desde tres configuraciones clásicas. En el conductor rectilíneo largo, la corriente genera líneas de campo circulares concéntricas alrededor del hilo, y el módulo del campo disminuye al alejarnos del conductor. En la espira circular, los aportes de todos los tramos de corriente se combinan y el campo se intensifica en el centro. En la bobina o solenoide, las espiras colaboran para producir un campo casi uniforme en el interior. La infografía también agrega el efecto de un núcleo ferromagnético, base del electroimán. Este punto es especialmente importante porque permite pasar del concepto físico a dispositivos reales como relés, contactores, electroválvulas, sensores y actuadores. Didácticamente, la lámina ayuda a comparar cómo la geometría modifica el patrón de líneas de campo, dónde el campo es más intenso y por qué el conjunto de espiras resulta más útil que un conductor aislado cuando se busca una acción electromagnética controlada.", "kind": "concept", "sim": null}, {"title": "Inducción y autoinducción", "kicker": "FARADAY · LENZ", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_induccion_autoinduccion_transformadores.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_induccion_autoinduccion_transformadores.png\" alt=\"Infografía sobre inducción electromagnética, autoinducción y transformadores\" loading=\"lazy\"><\/a><figcaption>Inducción electromagnética, autoinducción y transformadores. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">ℰ = −N dΦ<sub>B<\/sub>/dt<\/div><div class=\"formula\">ε<sub>auto<\/sub> = −L dI/dt<\/div><ul><li>Muestra cuándo aparece FEM inducida y cuándo no.<\/li><li>Introduce energía magnética almacenada y principio del transformador ideal.<\/li><li>Relaciona flujo variable, bobinas y transferencia de energía en corriente alterna.<\/li><\/ul>", "script": "Esta filmina incorpora una infografía de síntesis sobre inducción electromagnética, autoinducción y transformadores. La imagen deja claro que no basta con tener campo magnético: para inducir fuerza electromotriz debe variar el flujo magnético enlazado con la espira o bobina. Por eso compara un imán acercándose, en reposo y alejándose. Solo cuando cambia el flujo aparece fem inducida. La lámina también introduce la autoinducción: si la propia corriente de una bobina varía, cambia su flujo y aparece una fem que se opone a ese cambio. Ese comportamiento explica por qué una bobina se resiste a cambios bruscos de corriente y por qué puede almacenar energía en su campo magnético. Finalmente, la infografía muestra el transformador ideal, donde un primario en corriente alterna produce un flujo variable que induce tensión en el secundario. De este modo, la filmina unifica Faraday, Lenz, autoinducción y acoplamiento magnético en una secuencia conceptual coherente.", "kind": "concept", "sim": null}, {"title": "Transformadores: acoplamiento magnético", "kicker": "MÁQUINAS ELÉCTRICAS", "body": "<p>La tensión alterna del primario origina un flujo magnético variable común, que induce una FEM en el secundario.</p><div class=\"formula\">V₂/V₁ = N₂/N₁</div><div class=\"formula\">V₁ I₁ ≈ V₂ I₂ &nbsp; (ideal)</div><p><b>Ejemplo:</b> N₁=800; N₂=200; V₁=230 V CA → V₂≈57,5 V CA.</p><p>Un transformador convencional no funciona con flujo constante en régimen continuo.</p>", "script": "El transformador permite transferir energía eléctrica entre dos bobinados mediante un flujo magnético variable común. El primario recibe tensión alterna. La corriente magnetizante crea un flujo variable en el núcleo y ese flujo induce tensión en el secundario. Para un transformador ideal, la relación entre tensiones coincide con la relación entre número de espiras. Con ochocientas espiras primarias y doscientas secundarias, una tensión alterna eficaz de doscientos treinta voltios produce aproximadamente cincuenta y siete coma cinco voltios eficaces. No se crea energía: al reducir la tensión, la corriente disponible puede crecer en el modelo ideal, conservando aproximadamente la potencia. En la práctica existen pérdidas, corriente de magnetización y límites de aislamiento y calentamiento.", "kind": "concept", "sim": null}, {"title": "Motores eléctricos básicos", "kicker": "MÁQUINAS ELÉCTRICAS", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_motores_monofasicos_trifasicos.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_motores_monofasicos_trifasicos.png\" alt=\"Infografía técnica sobre motores monofásicos y trifásicos\" loading=\"lazy\"><\/a><figcaption>Motores monofásicos y trifásicos. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">Potencia eléctrica: P = V I<\/div><div class=\"formula\">Potencia mecánica: P = τ ω<\/div><ul><li>Compara motor monofásico y trifásico, principio de funcionamiento y usos.<\/li><li>Incluye lectura de placa, noción de rendimiento y potencia.<\/li><li>Agrega equivalencias: 1 HP ≈ 746 W y 1 CV ≈ 735,5 W.<\/li><\/ul>", "script": "Esta filmina incorpora una infografía detallada sobre motores monofásicos y trifásicos. La lámina explica, en primer lugar, que un motor eléctrico transforma energía eléctrica en energía mecánica por interacción entre corrientes y campos magnéticos. Luego compara el motor monofásico, que necesita dispositivos de arranque como bobinado auxiliar o capacitor, con el motor trifásico, que genera de manera natural un campo giratorio en el estator. La infografía agrega una comparación de aplicaciones, rendimiento y potencia típica, y suma un ejemplo de lectura de placa, aspecto muy útil para los estudiantes porque conecta la teoría con equipos reales. Finalmente incorpora la parte de potencia y las conversiones de unidades, indicando equivalencias entre watt, kilowatt, horse power y caballo vapor. Esto ayuda a interpretar catálogos, placas de motores y especificaciones técnicas de equipos industriales.", "kind": "concept", "sim": null}, {"title": "Introducción a la corriente trifásica", "kicker": "SISTEMAS ELÉCTRICOS", "body": "<figure class=\"infografia-u7\"><a href=\"assets/infografia_corriente_trifasica.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/infografia_corriente_trifasica.png\" alt=\"Infografía educativa sobre corriente trifásica\" loading=\"lazy\"><\/a><figcaption>Corriente trifásica. Pulsá sobre la imagen para ampliarla.<\/figcaption><\/figure><div class=\"formula\">v<sub>a<\/sub>=V̂ sen(ωt),&nbsp; v<sub>b<\/sub>=V̂ sen(ωt−120°),&nbsp; v<sub>c<\/sub>=V̂ sen(ωt+120°)<\/div><div class=\"formula\">P = √3 V<sub>L<\/sub> I<sub>L<\/sub> cos φ<\/div><ul><li>Resume desfasaje de 120°, estrella y triángulo, corrientes de línea y de fase.<\/li><li>Relaciona el sistema trifásico con el campo giratorio del motor.<\/li><li>Presenta ventajas y aplicaciones en instalaciones industriales.<\/li><\/ul>", "script": "Esta filmina ahora incorpora una infografía completa sobre corriente trifásica. La imagen muestra que un sistema trifásico está formado por tres tensiones sinusoidales de igual frecuencia y amplitud, desfasadas ciento veinte grados entre sí. A partir de esa estructura se comprenden las conexiones estrella y triángulo, la diferencia entre magnitudes de línea y de fase, y la expresión de la potencia activa trifásica. La lámina también destaca la idea de campo magnético giratorio, que es la base del funcionamiento de muchos motores industriales. Este recurso resulta didácticamente muy valioso porque integra la representación temporal de las fases, la conexión eléctrica y la aplicación electromecánica dentro de una sola síntesis visual.", "kind": "concept", "sim": null}, {"title": "Laboratorio: inducción", "kicker": "SIMULACIÓN INTERACTIVA", "body": "<div class=\"labdesc\">Variación de flujo y fuerza electromotriz inducida</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Variación de flujo y fuerza electromotriz inducida\" data-sim=\"s14\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "En la simulación analicen qué sucede al modificar frecuencia, número de espiras, área efectiva o intensidad del campo. Todos esos cambios alteran el flujo magnético o su ritmo de variación y, por lo tanto, modifican la fuerza electromotriz inducida. Miren la señal obtenida e intenten relacionar su amplitud con la ley de Faraday. No pierdan de vista el sentido físico: la señal aparece porque el sistema responde al cambio del flujo. Si el flujo fuese estrictamente constante, no habría inducción. También conviene discutir el papel del signo y su vínculo con la ley de Lenz.", "kind": "lab", "sim": "s14"}, {"title": "Instrumentación y sensores", "kicker": "TECNOLOGÍA DE ALIMENTOS", "body": "<ul><li>La cadena de medición transforma una variable física en una señal interpretable.</li><li>Pt100 y termocuplas permiten medir temperatura con principios diferentes.</li><li>Las señales de 4–20 mA se utilizan en instrumentación industrial.</li><li>El controlador interpreta la señal y puede actuar sobre calefacción, refrigeración o motores.</li></ul>", "script": "En tecnología de alimentos no estudiamos electricidad sólo por interés teórico: la necesitamos para medir, controlar y actuar sobre procesos. Toda cadena de instrumentación comienza con una variable física, como temperatura, nivel o presión. Un sensor transforma esa variable en una respuesta eléctrica; luego un transmisor o acondicionador adapta la señal para que pueda ser transportada e interpretada. Las Pt100 basan su funcionamiento en la variación de resistencia con la temperatura, mientras que las termocuplas producen una diferencia de potencial termoeléctrica. Las señales de 4 a 20 miliamperes son frecuentes porque son robustas frente a perturbaciones y permiten detectar fallas de lazo. Finalmente, un controlador interpreta la señal y puede gobernar actuadores como resistencias, válvulas o motores.", "kind": "concept", "sim": null}, {"title": "Caso integrador: tanque con calentamiento", "kicker": "APLICACIÓN INDUSTRIAL", "body": "<div class=\"labdesc\">Medición de temperatura y consumo eléctrico del calefactor</div><iframe class=\"labframe\" loading=\"lazy\" title=\"Simulación interactiva de Medición de temperatura y consumo eléctrico del calefactor\" data-sim=\"s16\" src=\"about:blank\"></iframe><p class=\"muted\">Los controles pertenecen al simulador original; desplazate dentro del panel para acceder a todas sus opciones.</p>", "script": "Este caso integrador reúne medición y actuación. El tanque posee una variable de proceso, la temperatura, que debe ser medida mediante un sensor y luego interpretada por un sistema de control. Al mismo tiempo, una resistencia calefactora transforma energía eléctrica en calor para modificar el estado del sistema. Observen cómo convergen aquí varios conceptos de la unidad: diferencia de potencial, corriente, resistencia, potencia, energía e instrumentación. No es un ejemplo artificial: en procesos alimentarios, muchas operaciones dependen precisamente de medir bien y suministrar energía de manera controlada. La actividad invita a mirar el sistema completo y no sólo cada ecuación por separado.", "kind": "lab", "sim": "s16"}, {"title": "Síntesis y preguntas para el cierre", "kicker": "CIERRE", "body": "<ul><li>¿Qué diferencia hay entre campo eléctrico y fuerza eléctrica?</li><li>¿Por qué en una esfera conductora la carga neta se ubica en su superficie exterior?</li><li>¿Puede haber potencial distinto de cero cuando el campo es nulo?</li><li>¿Qué evidencia aporta el electroscopio?</li><li>¿Cómo se aplican Kirchhoff y la ley de Ohm en una instalación de proceso?</li></ul>", "script": "Para cerrar la unidad conviene reconstruir el hilo conductor. Comenzamos con la carga eléctrica y las formas de electrización. Luego introdujimos campo y potencial para describir la interacción eléctrica tanto en lenguaje vectorial como energético. La ley de Gauss y las distribuciones esféricas nos permitieron aprovechar la simetría para interpretar campo y potencial en objetos concretos. Más tarde pasamos a corriente, resistencia, potencia y circuitos, y formalizamos su análisis con la ley de Ohm y las leyes de Kirchhoff. Finalmente incorporamos magnetismo, inducción e instrumentación. Las preguntas de esta última filmina no buscan un dato aislado: apuntan a verificar si logramos conectar las distintas representaciones de un mismo fenómeno físico.", "kind": "concept", "sim": null}];

function splitNarration(raw){return raw.match(/[^.!?\n]+(?:[.!?]+|\n|$)/g)?.map(s=>s.trim()).filter(Boolean)||[raw]}
function read(){stopSpeech();if(!('speechSynthesis' in window)){$('speechstatus').textContent='Síntesis de voz no disponible en este navegador';return;}const token=++speechToken;voiceQueue=splitNarration(getScript(current));let j=0;function next(){if(token!==speechToken)return;if(j>=voiceQueue.length){if(continuousReading&&current<slides.length-1){render(current+1);read();return;}$('speechstatus').textContent='Lectura terminada.';return}const u=new SpeechSynthesisUtterance(voiceQueue[j++]);u.lang='es-AR';u.rate=+$('rate').value;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='es-AR')||voices.find(v=>v.lang?.startsWith('es'))||null;u.onend=next;u.onerror=e=>{$('speechstatus').textContent='La voz reportó un error: '+e.error;};$('speechstatus').textContent='Narrando filmina '+(current+1)+' · fragmento '+j+'/'+voiceQueue.length;window.speechSynthesis.speak(u)}next()}
for(const [id,step] of [['prev',-1],['prev2',-1],['next',1],['next2',1]])$(id).onclick=()=>render(current+step);
$('goto').onchange=e=>render(+e.target.value);$('speak').onclick=read;$('pause').onclick=()=>window.speechSynthesis?.pause();$('resume').onclick=()=>window.speechSynthesis?.resume();$('stop').onclick=stopSpeech;
$('toggleScript').onclick=()=>{scriptOpen=!scriptOpen;$('scriptbox').classList.toggle('visible',scriptOpen);if(scriptOpen)$('scriptarea').value=getScript(current)};
$('saveScript').onclick=()=>{overrides[current]=$('scriptarea').value;saveStore();$('speechstatus').textContent='Guion personalizado guardado en la versión 0.9.'};$('resetScript').onclick=()=>{delete overrides[current];saveStore();$('scriptarea').value=getScript(current);$('speechstatus').textContent='Restablecido el guion predeterminado de la versión 0.9.'};
$('exportScripts').onclick=()=>{const result=slides.map((s,i)=>({filmina:i+1,titulo:s.title,guion:getScript(i)}));let b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='guiones_presentacion_unidad7.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importScripts').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('No es una lista');for(const item of data){const i=Number(item.filmina)-1;if(i>=0&&i<slides.length&&typeof item.guion==='string')overrides[i]=item.guion}saveStore();$('scriptarea').value=getScript(current);$('speechstatus').textContent='Guiones importados.'}catch(err){alert('Archivo inválido: '+err.message)}e.target.value=''};
slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.title;$('goto').appendChild(o)});const n=Number((location.hash||'').replace('#f',''))-1;render(Number.isInteger(n)&&n>=0?n:0);
window.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(current-1)}});
</script></body></html>
